      # segundo reapply); rpc_create_bank_account acepta p_account_kind (8º
      # parámetro, DEFAULT 'bank', ERRCODE P0414 fuera de dominio);
      # ANTI-OVERLOAD 42725 (una sola firma); ACLs restituidas tras el
      # DROP+CREATE OR REPLACE.
      - name: Run cuentas-billetera-tipo gates
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_cuentas_billetera_tipo.sql

      # compras-proveedor-cuenta-corriente: la cuenta corriente de proveedores
      # existia entera desde C-30 y nunca se uso — 0 proveedores, 0 movimientos,
      # y el helper compartido _pay_register_party_charge con su pata 'supplier'
      # escrita y SIN NINGUN LLAMADOR. Este change la conecta con el alta de
      # compra. Verifica: identidad fiscal de suppliers (RN-96, espejo de
      # clients) con rechazo REAL del CHECK de iva_condition; supplier_id
      # persistido en LAS DOS ramas del INSERT (la rama ELSE de linea de
      # servicio repite la lista de columnas y ya se olvido una vez);
      # GATE ESTRELLA — el cargo se dispara con v_kind CRUDO y solo con
      # kind='credit': cash no carga y "sin forma de pago" TAMPOCO, aunque el
      # evento contable siga propagando 'credit' (usar el COALESCE ahi haria
      # que el 100% de las compras historicas sin forma de pago endeudara
      # proveedores en silencio); guards P0400 credit_requires_supplier (sin
      # efectos y SIN quemar el slot de idempotencia — el reintento con la
      # misma clave y proveedor tiene exito real) y P0404 para proveedor ajeno
      # o borrado; tri-estado de supplier_id y de cost_center_id en sus tres
      # estados (cierra la OQ-1 de edicion-preserva-contexto: el
      # CostCenterSelect estaba montado en el form de edicion sin efecto
      # alguno); e INVARIANTE D7 — editar una compra sin cargo no toca la
      # cuenta corriente.
      #
      # Y las TRES piezas que existian desde pagos-cableados-restantes /
      # delete-guard-ledgers y eran INALCANZABLES porque nada posteaba un cargo
      # de proveedor, ejercitadas aca por primera vez en su camino real:
      # P0423 (compra con cargo = inmutable), compensacion por borrado
      # (debit_note negativo + stock repuesto + asiento revertido) y P0425
      # (cargo ya cancelado por un PaymentMade => borrado rechazado sin efectos
      # parciales), mas la no-regresion contable de 2100 Proveedores.
      - name: Run compras-proveedor-cuenta-corriente gates
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_compras_proveedor_cuenta_corriente.sql

      # v31-tenancy-pool-rls Paso 2 (grupo 7, tasks.md 7.3c/7.4): el backend
      # Python conecta como `postgres` (BYPASSRLS=true) — la RLS de las 68
      # tablas de public/ nunca se evalúa para el backend hoy. Detrás de la
      # palanca `tenancy_rls_role_enabled` (apagada por defecto, aislada del
      # resto de la app), get_db_conn adopta `SET LOCAL ROLE authenticated`
      # (rolbypassrls=false) dentro de la misma transacción del Paso 1. Los
      # tests de backend/tests/test_database.py prueban con MOCKS que ese
      # SQL se emite en el orden correcto — no pueden probar que la RLS
      # REALMENTE aísla. Este gate reproduce el mecanismo exacto contra
      # Postgres real (mismo patrón que test_payment_methods_catalog.sql
      # (6)): dos cuentas sintéticas, SET LOCAL ROLE authenticated + claims,
      # y confirma que la cuenta A no ve una fila de la cuenta B en
      # productos, caja o ventas — ni con el filtro de account_id que ya
      # usan los repositories NI omitiéndolo (0 filas, nunca "permission
      # denied" crudo). Verificado con un control negativo local (RLS
      # deshabilitada a propósito en products) que el gate SÍ detecta la
