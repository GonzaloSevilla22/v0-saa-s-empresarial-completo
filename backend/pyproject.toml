[project]
name = "emprende-smart-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "PyJWT[crypto]>=2.8.0",
    "pydantic-settings>=2.2",
    "asyncpg>=0.29",
    "redis>=5.0",
    "tenacity>=8.2",
    "fpdf2>=2.7",
    "zeep>=4.2,<5",
    "supabase>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "asyncpg-stubs>=0.29",
]

[tool.setuptools.packages.find]
where = [".."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests de integración contra servicios externos (excluidos del gate de CI; correr con -m integration)",
]

# Coverage del gate de CI (Backend_Tests.yml): medir solo código de app —
# contar los tests a sí mismos infla el número (~96% vs ~91% real).
[tool.coverage.run]
omit = ["*/tests/*", "*/.venv/*"]
