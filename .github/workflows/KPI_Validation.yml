      # difference a 0 deja difference_before_adjustments como evidencia, con
      # signos mixtos sumando correctamente; ajuste bancario P0413 sin motivo
      # SIN quemar el slot de idempotencia (reintento con la misma clave +
      # motivo tiene éxito real) y transfer_in sin motivo intacto.
      - name: Run banco-caja-historial-ajustes gates
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_banco_caja_historial_ajustes.sql

      # cuentas-billetera-tipo: pedido textual del PO 2026-08-22 — distingue
      # banco real de billetera virtual en bank_accounts (account_kind). Las
      # 4 cuentas activas de prod son billeteras, ninguna es un banco real.
      # Verifica: account_kind NOT NULL default 'bank' + CHECK de dominio
      # cerrado; backfill por heurística de nombre (12 marcas de la lista
      # cerrada → wallet, control negativo "Banco Comodoro" y una cuenta
