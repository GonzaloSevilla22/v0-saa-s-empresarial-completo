name: KPI Validation

on:
  pull_request:
    branches: [main]

jobs:
  validate-kpis:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check hidden BOM characters
        run: |
          if grep -rIl $'\xEF\xBB\xBF' supabase/migrations supabase/tests; then
            echo "BOM detected in SQL files"
            exit 1
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.105.0

      - name: Start Supabase
        run: supabase start

      # deudas-menores-agosto (G1 + G4): las dos migraciones nuevas deben ser
      # reejecutables (CREATE OR REPLACE / ON CONFLICT DO UPDATE / DELETE
      # re-derivado / UPDATE ... WHERE account_id IS NULL). `supabase start`
      # ya las aplicó una vez al levantar el stack; esto las reaplica a mano
      # y compara un fingerprint de estado antes/después — debe ser idéntico
      # (tasks 2.5 y 5.6: verificación de idempotencia real, no declarada).
      #
      # metodos-pago-operaciones: 20260924000001 hace CREATE OR REPLACE de
      # rpc_create_sale_operation(_v2)/rpc_create_purchase_operation con SU
      # firma vigente en esa fecha (sin payment_method_id). Re-aplicarla acá
      # DESPUÉS de que 20260928000001 ya cambió esa firma no "reemplaza" nada
      # — CREATE OR REPLACE con una lista de argumentos distinta crea un
      # OVERLOAD nuevo (mismo mecanismo 42725 que el D4 de esta migración
      # evita con DROP+CREATE), y ese overload nuevo nace con el ACL default
      # (EXECUTE a PUBLIC → anon lo hereda) porque no hay una función con esa
      # firma exacta para "heredarle" el REVOKE — exactamente el patrón
      # advisor 0028/0029 que test_function_acl_gate.sql existe para atrapar.
      # Se re-aplica 20260928000001 al final para converger al estado
      # correcto (prueba, de paso, que la propia migración es re-appliable).
      - name: Verify G1/G4 migrations are idempotent on reapply
        run: |
          set -e
          DSN=postgresql://postgres:postgres@127.0.0.1:54322/postgres
          FINGERPRINT="SELECT (SELECT count(*) FROM public.analytics_events WHERE event_name='operation_created') || '|' || (SELECT count(*) FROM public.sale_items WHERE account_id IS NULL) || '|' || (SELECT count(*) FROM public.purchase_items WHERE account_id IS NULL) || '|' || (SELECT count(*) FROM public.account_feature_flags WHERE flag_key='sale_items_rpc_v2')"
          # fix-ci-idempotencia-reapply-firmas (2026-09-02, capa 2): este paso
          # reaplica migraciones VIEJAS fuera de su orden cronológico real para
          # probar idempotencia — eso es un ejercicio, no debe dejar rastro. El
          # FINGERPRINT de arriba sólo cubre 4 contadores de DATOS; los gates
          # ANTI-OVERLOAD tolerados más abajo sólo cubren FUNCIONES puntuales
          # que ya sabíamos que rompían. Pero cualquier objeto de schema no
          # cubierto por ninguno de los dos (constraints, ACLs, lo que sea) que
          # una migración VIEJA de esta cadena también toque puede revertir en
          # silencio sin que nada de lo anterior lo note — el primer síntoma
          # sería un gate de OTRO paso, más adelante en el job (pasó de verdad:
          # el CHECK de cash_movements.movement_type volvía a 7/8 tipos en vez
          # de los 13 vigentes, y lo agarró test_cash_movement_types.sql, no
          # este paso). schema_snapshot() es la red generalizada: constraints
          # (pg_get_constraintdef) + TODAS las firmas de función de
          # public/community (pg_get_function_arguments — cualquier overload
          # fantasma que se nos escape aparece acá también, no sólo los 3 ya
          # conocidos) + ACLs de función (proacl). Se captura ANTES de tocar
          # nada — es la definición de "estado correcto" contra la que se
          # compara al final.
          schema_snapshot() {
            psql -tA "$DSN" -c "SELECT n.nspname || '.' || c.relname || '.' || con.conname || ' :: ' || pg_get_constraintdef(con.oid) FROM pg_constraint con JOIN pg_class c ON c.oid = con.conrelid JOIN pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname IN ('public','community') ORDER BY 1"
            psql -tA "$DSN" -c "SELECT n.nspname || '.' || p.proname || '(' || pg_get_function_arguments(p.oid) || ') RETURNS ' || pg_get_function_result(p.oid) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace WHERE n.nspname IN ('public','community') ORDER BY 1"
            psql -tA "$DSN" -c "SELECT n.nspname || '.' || p.proname || '(' || pg_get_function_identity_arguments(p.oid) || ') :: ' || COALESCE(array_to_string(p.proacl, ','), '<default>') FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace WHERE n.nspname IN ('public','community') ORDER BY 1"
          }
          schema_snapshot > /tmp/schema_before_reapply.txt
          BEFORE=$(psql -tA "$DSN" -c "$FINGERPRINT")
          psql -v ON_ERROR_STOP=1 "$DSN" -f supabase/migrations/20260924000001_activate_sale_items_rpc_v2.sql
          psql -v ON_ERROR_STOP=1 "$DSN" -f supabase/migrations/20260925000001_cleanup_analytics_and_line_account_id.sql
          AFTER=$(psql -tA "$DSN" -c "$FINGERPRINT")
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "NOT IDEMPOTENT: fingerprint changed on reapply ($BEFORE -> $AFTER)"
            exit 1
          fi
          echo "Idempotent: fingerprint unchanged on reapply ($BEFORE)"
          # metodos-pago-operaciones: reconverger la firma de las RPCs de
          # creación tras el reapply de arriba (ver comentario extenso sobre
          # el paso).
          #
          # edicion-preserva-contexto: 20260928000001 también DROPea+CREATEa
          # rpc_atomic_update_sale_operation/rpc_atomic_update_purchase_
          # operation con SU firma vigente en esa fecha (7/6 args, sin
          # branch_id/canal) — y 20260930000001 (este change) volvió a
          # cambiar esa firma (11/8 args). Reaplicar 20260928000001 fuera de
          # su orden cronológico real (después de una migración MÁS NUEVA
          # que vuelve a tocar las mismas dos RPCs) hace que su propio gate
          # ANTI-OVERLOAD interno se dispare — detecta correctamente el
          # overload fantasma que la reaplicación misma crea (su `DROP
          # FUNCTION IF EXISTS` con la firma de esa fecha no matchea la
          # firma 11/8-arg vigente, así que el `CREATE OR REPLACE` que sigue
          # crea un segundo overload en vez de reemplazar). Es el mismo
          # mecanismo 42725 de la nota de arriba, un tramo más adelante en
          # la cadena — se tolera el fallo de ESTE paso puntual (no de los
          # demás) y se reconverge de inmediato reaplicando 20260930000001,
          # cuyo propio `DROP FUNCTION IF EXISTS` con la firma 7/6-arg SÍ
          # matchea el overload fantasma recién creado y lo limpia, dejando
          # exactamente 1 definición de cada función con el cuerpo final
          # correcto (de paso, prueba que 20260930000001 es re-appliable).
          # La tolerancia es ESTRECHA (compras-proveedor-cuenta-corriente,
          # review A / CI-1): sólo se acepta el fallo cuyo output contiene el
          # marcador literal del gate ANTI-OVERLOAD de este archivo. Cualquier
          # otro error del reapply (sintaxis, permisos, una regresión real)
          # imprime el output y falla el paso — antes, un `if ! psql ...`
          # pelado se tragaba TODO fallo de esta migración en silencio.
          # Nota: a diferencia de 20261002000001 más abajo, el gate de este
          # archivo NO es lo último (le siguen el CREATE de
          # rpc_payment_method_report y sus ACLs), así que el reapply tolerado
          # los saltea — no-op en la práctica: nada posterior en esta cadena
          # los redefine y ya quedaron aplicados en el apply inicial del stack.
          set +e
          REAPPLY_OUT=$(psql -v ON_ERROR_STOP=1 "$DSN" -f supabase/migrations/20260928000001_payment_methods_operaciones.sql 2>&1)
          REAPPLY_RC=$?
          set -e
          echo "$REAPPLY_OUT"
          if [ "$REAPPLY_RC" -ne 0 ]; then
            if echo "$REAPPLY_OUT" | grep -qF 'GATE ANTI-OVERLOAD FAILED'; then
              echo "20260928000001 reapply disparó su propio gate ANTI-OVERLOAD (esperado: 20260930000001 ya cambió de nuevo la firma) — reconvergiendo con 20260930000001"
            else
              echo "ERROR: el reapply de 20260928000001 falló por un motivo DISTINTO del gate ANTI-OVERLOAD esperado."
              exit 1
            fi
          fi
          psql -v ON_ERROR_STOP=1 "$DSN" -f supabase/migrations/20260930000001_edicion_preserva_contexto.sql
          # pagos-cableados-restantes: 20260930000001 (edicion-preserva-contexto)
          # NO toca rpc_create_sale_operation/rpc_create_purchase_operation —
          # sólo rpc_atomic_update_sale_operation/rpc_atomic_update_purchase_
          # operation (las RPCs de EDICIÓN, no de creación). El reapply de
          # 20260924000001 más arriba en esta misma secuencia SÍ redefine
          # rpc_create_sale_operation con SU firma vigente en esa fecha (7 args,
          # sin payment_method_id) — su propio DROP FUNCTION IF EXISTS matchea el
          # overload fantasma de esa reaplicación puntual, pero dispara a su vez
          # el gate ANTI-OVERLOAD de 20260928000001 (tolerado arriba) porque dejó
          # un segundo overload (8 args, con payment_method_id, sin
          # cash_session_id) que nada de lo que sigue vuelve a tocar. Reconverge
          # reaplicando esta migración al final de la cadena: su propio DROP
          # FUNCTION IF EXISTS con la firma 8-arg (SIN cash_session_id) matchea
          # exactamente ese overload fantasma y el CREATE OR REPLACE que sigue
          # deja 1 sola definición de cada función con el cuerpo final correcto
          # (de paso, prueba que esta migración es re-appliable).
          psql -v ON_ERROR_STOP=1 "$DSN" -f supabase/migrations/20261001000001_pagos_cableados_restantes.sql
          # pos-banco-movimientos: 20261001000001 (reaplicada arriba) redefine
          # _c29_confirm_order_core, rpc_create_sale_operation(_v2) y
          # rpc_create_purchase_operation con SU firma vigente en esa fecha
          # (sin p_bank_account_id) — mismo mecanismo de la nota anterior: su
          # CREATE OR REPLACE ya no matchea la firma NUEVA vigente (esta
          # migración le agregó p_bank_account_id trailing), así que crea un
          # overload fantasma en vez de reemplazar (ambigüedad 42725 real,
          # detectada en CI: "function ... is not unique" al llamar con menos
          # argumentos posicionales que el total de ambas firmas). Reconverge
          # reaplicando esta migración al final de la cadena: sus propios
          # DROP FUNCTION IF EXISTS (firma exacta sin p_bank_account_id)
          # matchean los overloads fantasma recién creados y los CREATE OR
          # REPLACE que siguen dejan 1 sola definición de cada función (de
          # paso, prueba que esta migración es re-appliable).
          # compras-proveedor-cuenta-corriente: este reapply pasa a TOLERARSE,
          # mismo tratamiento (y mismo motivo) que 20260928000001 más arriba.
          # 20261002000001 dropea las firmas de rpc_create_purchase_operation
          # (7 args) y rpc_atomic_update_purchase_operation (6 args) vigentes
          # en SU fecha y crea las de 8 args. Como 20261009000001 volvió a
          # cambiar esas firmas (9 y 12 args), el DROP de este archivo ya no
          # matchea la firma viva y el CREATE OR REPLACE que sigue nace como
          # OVERLOAD FANTASMA en vez de reemplazar — con lo cual su propio gate
          # ANTI-OVERLOAD interno se dispara y detecta correctamente el
          # overload que la reaplicación misma acaba de crear. Ese gate está al
          # final del archivo (línea ~2609 de 2660) y no lo sigue ningún DDL,
          # así que tolerar el fallo no saltea nada: se reconverge al final de
          # la cadena con 20261009000001, cuyos DROP FUNCTION IF EXISTS con las
          # firmas EXACTAS de 8 args limpian los dos fantasmas.
          # La tolerancia es ESTRECHA (review A / CI-1): se acepta ÚNICAMENTE
          # el fallo cuyo output contiene el marcador literal de ese gate
          # ANTI-OVERLOAD. Cualquier otro error imprime el output y falla el
          # paso, en vez de quedar tapado por un `if ! psql ...` pelado.
          set +e
          REAPPLY_OUT=$(psql -v ON_ERROR_STOP=1 "$DSN" -f supabase/migrations/20261002000001_pos_banco_movimientos.sql 2>&1)
          REAPPLY_RC=$?
          set -e
          echo "$REAPPLY_OUT"
          if [ "$REAPPLY_RC" -ne 0 ]; then
            if echo "$REAPPLY_OUT" | grep -qF 'GATE POS-BANCO-MOVIMIENTOS FAILED (1, 42725)'; then
              echo "20261002000001 reapply disparó su propio gate ANTI-OVERLOAD (esperado: 20261009000001 ya cambió de nuevo las dos firmas) — reconvergiendo al final de la cadena"
            else
              echo "ERROR: el reapply de 20261002000001 falló por un motivo DISTINTO del gate ANTI-OVERLOAD esperado."
              exit 1
            fi
          fi
          # limpiezas-pagos-admin: el reapply de 20261002000001 arriba
          # redefine _c29_confirm_order_core y rpc_create_purchase_operation
          # (entre otras) con SU cuerpo vigente en esa fecha — que todavía
          # escribe sales_orders.payment_method (columna que esta migración
          # dropea) y todavía usa los ERRCODE de 4 caracteres que G3
          # corrige. A diferencia de las notas anteriores, acá NO hay
          # conflicto de firma/overload (esta migración no cambia ninguna
          # firma, solo cuerpos vía CREATE OR REPLACE + dos DROP FUNCTION
          # permanentes + un ALTER TABLE DROP COLUMN, todos idempotentes por
          # diseño) — se reconverge reaplicando esta migración una última
          # vez al final de toda la cadena: el DO de G3 vuelve a corregir
          # cualquier ERRCODE revertido, G1a/G1b vuelven a dejar los cuerpos
          # sin la columna, y el DROP COLUMN/DROP FUNCTION, ya aplicados, son
          # no-op (de paso, prueba que esta migración es re-appliable).
          psql -v ON_ERROR_STOP=1 "$DSN" -f supabase/migrations/20261003000001_limpiezas_pagos_admin.sql
          # asiento-venta-formulario: el reapply de 20261003000001 arriba
          # redefine _journal_post_from_event, rpc_create_sale_operation_v2,
          # rpc_atomic_update_sale_operation y rpc_process_outbox_dispatch
          # con SU cuerpo vigente en esa fecha — ANTES de este change, sin
          # las ramas SaleOperationCreated/SaleOperationAdjusted ni el
          # reemplazo in-place de la edición. `supabase start` ya aplicó
          # esta migración nueva una vez al levantar el stack (es la última
          # de la cadena por timestamp); reaplicar una migración MÁS VIEJA
          # después la revierte en silencio, y el gate nuevo de abajo
          # fallaría con un "phantom regression" que no reproduce en local
          # (mismo mecanismo que las notas anteriores, sin conflicto de
          # firma/overload acá — CREATE OR REPLACE sin DROP en las cuatro
          # funciones, REVOKE/GRANT idempotentes). Se reconverge reaplicando
          # esta migración una última vez al final de toda la cadena (de
          # paso, prueba que es re-appliable).
          psql -v ON_ERROR_STOP=1 "$DSN" -f supabase/migrations/20261004000001_asiento_venta_formulario.sql
          # delete-guard-ledgers: el reapply de 20261004000001 arriba redefine
          # _journal_post_from_event y rpc_process_outbox_dispatch con SU
          # cuerpo vigente en esa fecha — ANTES de este change, sin las ramas
          # SaleOperationDeleted/PurchaseDeleted ni el filtro ampliado del
          # Consumer 3. Mismo mecanismo que la nota anterior: `supabase start`
          # ya aplicó esta migración nueva una vez al levantar el stack (es la
          # última de la cadena por timestamp); reaplicar una migración MÁS
          # VIEJA después la revierte en silencio — el evento
          # SaleOperationDeleted queda marcado processed_at sin haber pasado
          # por ningún consumer (el filtro de tipo del dispatcher no lo
          # reconoce), así que el gate de abajo fallaría con "asiento
          # esperado reversed, es posted" que no reproduce en local (mismo
          # patrón "phantom regression" documentado arriba). Se reconverge
          # reaplicando esta migración una última vez al final de toda la
          # cadena — sin conflicto de firma/overload (las dos RPCs de borrado
          # son firmas NUEVAS, nunca tocadas por las migraciones más viejas
          # reaplicadas arriba; los dos consumers cambian solo de cuerpo vía
          # CREATE OR REPLACE) — de paso, prueba que es re-appliable.
          psql -v ON_ERROR_STOP=1 "$DSN" -f supabase/migrations/20261005000001_delete_guard_ledgers.sql
          # banco-caja-historial-ajustes: `supabase start` ya aplicó esta
          # migración una vez al levantar el stack (es la más nueva por
          # timestamp). Ninguna migración reaplicada arriba en esta cadena
          # (hasta 20261005000001 inclusive) toca la firma de
          # rpc_register_cash_movement, c28_register_cash_movement,
          # rpc_close_cash_session o rpc_register_bank_movement — sin
          # conflicto de firma/overload al reaplicar esta migración al final.
          # rpc_register_cash_movement/c28_register_cash_movement ganaron
          # p_description trailing (DROP+CREATE con la firma NUEVA de 5 args,
          # ya vigente tras el primer apply) — el DROP FUNCTION IF EXISTS de
          # este archivo matchea esa firma de 5 args y el CREATE que sigue
          # deja 1 sola definición (de paso, prueba que es re-appliable —
          # verificado también localmente con `docker exec ... psql -f`,
          # doble aplicación sin error y sin cambio de fingerprint).
          psql -v ON_ERROR_STOP=1 "$DSN" -f supabase/migrations/20261006000001_banco_caja_historial_ajustes.sql
          # compras-proveedor-cuenta-corriente: último eslabón de la cadena
          # que cambia FIRMAS (lo sigue cuenta-corriente-party-guard, que no
          # cambia ninguna), y tiene que estar acá. Esta migración cambia DOS
          # firmas —
          # rpc_create_purchase_operation (8 -> 9 args, + p_supplier_id) y
          # rpc_atomic_update_purchase_operation (8 -> 12 args, + supplier y
          # cost_center tri-estado). Los reapplies de arriba redefinen esas dos
          # funciones con SU firma vigente en esa fecha: 20261002000001 con
          # CREATE OR REPLACE de 8 args (crea un OVERLOAD fantasma en vez de
          # reemplazar, mecanismo 42725 ya documentado cinco veces en este
          # paso) y 20261003000001 (G3) reescribiendo el CUERPO de
          # rpc_create_purchase_operation vía regexp sobre pg_get_functiondef()
          # para expandir los ERRCODE de 4 chars a 5 — sobre la firma que
          # encuentre. Reaplicar esta migración al final reconverge: sus
          # propios DROP FUNCTION IF EXISTS con las firmas EXACTAS viejas
          # matchean los overloads fantasma recién creados y los CREATE OR
          # REPLACE que siguen dejan 1 sola definición de cada función, con el
          # cuerpo final correcto y los ERRCODE de 5 chars ya incorporados (de
          # paso, prueba que esta migración es re-appliable — verificado
          # también en local con docker exec ... psql, tres aplicaciones
          # seguidas sin error y sin cambio de fingerprint).
          #
          # Su propio gate ANTI-OVERLOAD interno (STEP 4) falla el paso si
          # quedara más de una firma por función, así que la reconvergencia no
          # es una promesa sino una aserción.
          #
          # fix-ci-idempotencia-reapply-firmas (2026-09-02): lo de arriba dejó
          # de ser cierto — caja-compras-cobranzas (20261018000001, que NO
          # está en esta cadena) volvió a cambiar rpc_create_purchase_operation
          # (9 -> 10 args, + p_cash_session_id) DESPUÉS de esta migración. El
          # DROP FUNCTION IF EXISTS de este archivo (firma de 9 args) ya no
          # matchea la firma de 10 args vigente, así que su CREATE FUNCTION
          # crea un OVERLOAD FANTASMA en vez de reemplazar — mismo mecanismo
          # 42725 documentado seis veces en este paso, un tramo más adelante
          # en la cadena — y su propio gate ANTI-OVERLOAD (STEP 4, que la nota
          # de arriba describía como "aserción" de que no pasaría) lo detecta
          # y falla correctamente. Se tolera ESTRECHAMENTE (mismo criterio que
          # los demás: sólo el marcador literal de ESTE gate) y se reconverge
          # con una limpieza quirúrgica más abajo (después de
          # cuenta-corriente-party-guard, que le pasa lo mismo a las 2 RPCs de
          # pago) — reaplicar 20261018000001 entero NO sirve como
          # reconvergencia acá: a diferencia de las migraciones que sí se
          # reaplican en esta cadena, la suya usa CREATE FUNCTION liso (no OR
          # REPLACE) para rpc_create_purchase_operation, y su propio DROP
          # FUNCTION IF EXISTS apunta a la firma de 9 args (la que este mismo
          # archivo acaba de crear), no a la de 10 — con la firma de 10 args
          # ya viva sin tocar, el CREATE FUNCTION de 20261018000001 choca con
          # "function already exists with same argument types" (verificado
          # localmente: `docker exec ... psql -f 20261018000001...sql` sobre
          # este estado aborta ahí, un error CRUDO de Postgres, no el gate
          # controlado — no es tolerable con el patrón grep de este paso).
          set +e
          REAPPLY_OUT=$(psql -v ON_ERROR_STOP=1 "$DSN" -f supabase/migrations/20261009000001_compras_proveedor_cuenta_corriente.sql 2>&1)
          REAPPLY_RC=$?
          set -e
          echo "$REAPPLY_OUT"
          if [ "$REAPPLY_RC" -ne 0 ]; then
            if echo "$REAPPLY_OUT" | grep -qF 'GATE compras-proveedor (anti-overload) FAILED: public.rpc_create_purchase_operation tiene 2 definiciones (esperado 1)'; then
              echo "20261009000001 reapply disparó su propio gate ANTI-OVERLOAD (esperado: 20261018000001 ya cambió de nuevo la firma) — se reconverge con la limpieza quirúrgica de más abajo"
            else
              echo "ERROR: el reapply de 20261009000001 falló por un motivo DISTINTO del gate ANTI-OVERLOAD esperado."
              exit 1
            fi
          fi
          # revoke-internal-money-helpers (hotfix 2026-08-23): tiene que ir
          # DESPUÉS de todos los reapplies que reabren el agujero — es el
          # ANTEÚLTIMO eslabón desde que cuenta-corriente-party-guard se sumó
          # abajo (ver el bloque siguiente: esa migración verifica en su gate
          # final que este REVOKE ya corrió, así que también depende de que
          # este eslabón la preceda). Dos de los reapplies de arriba
          # reintroducen en silencio el GRANT EXECUTE ... TO authenticated que
          # este hotfix revoca: 20261001000001 (L137, _pay_register_party_
          # charge — GRANT explícito desde su creación) y 20261004000001
          # (L1778, _journal_post_from_event — CREATE OR REPLACE + REVOKE/GRANT
          # "de plantilla"). Ninguna migración reaplicada DESPUÉS de esas dos
          # (20261005000001..20261009000001) vuelve a tocar el ACL de ninguno
          # de los dos helpers — así que sin este reapply al final, `supabase
          # start` deja el estado correcto una vez, pero el bloque de arriba lo
          # revierte en silencio antes de que corra el gate. Sin conflicto de
          # firma/overload (esta migración no crea funciones, solo revoca
          # EXECUTE de dos ya existentes) — mismo mecanismo "phantom
          # regression" documentado en las notas anteriores, un eslabón más.
          psql -v ON_ERROR_STOP=1 "$DSN" -f supabase/migrations/20261010000001_revoke_internal_money_helpers.sql
          # cuenta-corriente-party-guard: ÚLTIMO eslabón de la cadena, y tiene
          # que serlo. Esta migración es el caso más simple de todos —solo
          # CREATE OR REPLACE (ninguna de las 5 funciones cambia de firma POR
          # SÍ MISMA, así que no puede generar overloads fantasma POR SU
          # PROPIA CUENTA: su propio gate ANTI-OVERLOAD lo verifica) más
          # REVOKE/GRANT y COMMENT, todos idempotentes—, pero va al final por
          # DOS razones concretas:
          #   1. Revoca c30_get_or_create_customer_account / _supplier_account
          #      (los dos choke points), y el reapply de 20261001000001 (L137)
          #      y 20261004000001 (~L1778) más arriba en esta cadena vuelve a
          #      ejecutar bloques REVOKE+GRANT del "patrón uniforme" — el mismo
          #      mecanismo que le devolvió el GRANT a authenticated a
          #      _pay_register_party_charge y a _journal_post_from_event
          #      (L1914) y que motivó el eslabón anterior.
          #   2. Su gate final NO revoca esos dos helpers de dinero (eso lo
          #      hace el hotfix #454, eslabón de arriba) pero SÍ VERIFICA que
          #      sigan sin EXECUTE para anon/authenticated. O sea que este
          #      eslabón sólo puede correr DESPUÉS del de #454: es el candado
          #      que detecta si un reapply futuro vuelve a reabrirlos.
          # Va DESPUÉS de 20261009000001 (compras-proveedor-cuenta-corriente):
          # ese archivo no re-otorga ningún EXECUTE sobre estos helpers ni
          # redefine ninguna de las 5 funciones que este change reescribe
          # (verificado), así que el orden entre ambos es libre por ese lado —
          # pero el invariante "la nuestra última" se mantiene por si un
          # eslabón futuro vuelve a arrastrar el patrón REVOKE+GRANT.
          # De paso, prueba que el archivo es re-appliable (verificado también
          # en local: doble aplicación sin error y sin cambio de fingerprint de
          # cuerpos, ACLs y comments de las 7 funciones tocadas).
          #
          # fix-ci-idempotencia-reapply-firmas (2026-09-02): "ninguna cambia de
          # firma" ya no alcanza — dos de las 5 funciones que este archivo
          # reescribe (rpc_register_payment_received / rpc_register_payment_
          # made) SÍ cambiaron de firma DESPUÉS, en dos pasos: caja-compras-
          # cobranzas (20261018000001, +p_cash_session_id, 6 -> 7 args) y
          # cobranzas-catalogo-pagos (20261020000001, p_payment_method text ->
          # p_payment_method_id uuid, misma aridad). Ninguna de las dos está en
          # esta cadena. El CREATE OR REPLACE de este archivo (firma vieja de 6
          # args, p_payment_method text) ya no matchea ninguna firma vigente,
          # así que en vez de reemplazar crea DOS overloads fantasma (uno por
          # función) — mismo mecanismo 42725, esta vez sin DROP FUNCTION de por
          # medio (CREATE OR REPLACE con una lista de argumentos distinta
          # también lo dispara). Su propio gate ANTI-OVERLOAD (que la nota de
          # arriba describía como prueba de que "no puede pasar") lo detecta:
          # esperaba 5 definiciones y encuentra 7. Se tolera ESTRECHAMENTE
          # (marcador literal de este gate) y se reconverge con la limpieza
          # quirúrgica de abajo — reaplicar 20261018000001/20261020000001
          # enteras no sirve por el mismo motivo que en la nota de
          # 20261009000001 más arriba (CREATE FUNCTION liso, no OR REPLACE,
          # sobre una firma que ya está viva sin tocar: choca con "already
          # exists", un error crudo, no el gate controlado — verificado
          # localmente para las dos).
          set +e
          REAPPLY_OUT=$(psql -v ON_ERROR_STOP=1 "$DSN" -f supabase/migrations/20261011000001_cuenta_corriente_party_guard.sql 2>&1)
          REAPPLY_RC=$?
          set -e
          echo "$REAPPLY_OUT"
          if [ "$REAPPLY_RC" -ne 0 ]; then
            if echo "$REAPPLY_OUT" | grep -qF 'cuenta-corriente-party-guard ANTI-OVERLOAD: esperaba exactamente 5 definiciones de las 5 funciones reescritas (ninguna cambió de firma), hay 7'; then
              echo "20261011000001 reapply disparó su propio gate ANTI-OVERLOAD (esperado: 20261018000001/20261020000001 ya cambiaron de nuevo las 2 firmas de pago) — se reconverge con la limpieza quirúrgica de abajo"
            else
              echo "ERROR: el reapply de 20261011000001 falló por un motivo DISTINTO del gate ANTI-OVERLOAD esperado."
              exit 1
            fi
          fi
          # fix-ci-idempotencia-reapply-firmas (2026-09-02): limpieza
          # quirúrgica de los overloads fantasma tolerados arriba (20261009000001
          # sobre rpc_create_purchase_operation, 20261011000001 sobre las 2 RPCs
          # de pago). Nada MÁS ADELANTE en esta cadena toca esas 3 firmas —a
          # diferencia de todos los casos anteriores de este paso, donde una
          # migración posterior con CREATE OR REPLACE reconvergía sola—, así que
          # sin esto el paso terminaría "verde" dejando 2 definiciones vivas por
          # función (9 y 10 args para la de compra; 6 y 7 para cada una de pago)
          # para el resto del pipeline de CI. Verificado localmente que eso es
          # peligroso, no solo antiestético: los call-sites reales de los tests
          # (test_compras_proveedor_cuenta_corriente.sql, test_cuenta_corriente_
          # party_guard.sql, test_party_payment_cash.sql, etc.) llaman con
          # notación con nombre y omiten los parámetros nuevos (p_cash_session_id
          # / el propio p_payment_method_id vs p_payment_method) — con las DOS
          # firmas vivas, Postgres resuelve el overload por "menos argumentos
          # completados por DEFAULT", que es la firma VIEJA, no la nueva: la
          # llamada no explota (nunca da "is not unique"), pero silenciosamente
          # invoca la función equivocada. Se dropean por firma EXACTA (no la
          # firma nueva — DROP FUNCTION IF EXISTS es un no-op si ya no existe,
          # así que este bloque es idempotente si algún día una firma vieja deja
          # de estar presente) y se ASERTA que sólo queda 1 definición de cada
          # una de las 3 — no es una promesa, es una aserción (mismo criterio que
          # el resto de este paso).
          psql -v ON_ERROR_STOP=1 "$DSN" -c "
            DROP FUNCTION IF EXISTS public.rpc_create_purchase_operation(text, date, text, jsonb, uuid, uuid, uuid, uuid, uuid);
            DROP FUNCTION IF EXISTS public.rpc_register_payment_received(text, uuid, numeric, uuid, text, uuid);
            DROP FUNCTION IF EXISTS public.rpc_register_payment_made(text, uuid, numeric, uuid, text, uuid);
          "
          OVERLOAD_COUNT=$(psql -tA "$DSN" -c "SELECT count(*) FROM pg_proc WHERE pronamespace = 'public'::regnamespace AND proname IN ('rpc_create_purchase_operation','rpc_register_payment_received','rpc_register_payment_made')")
          if [ "$OVERLOAD_COUNT" -ne 3 ]; then
            echo "NOT IDEMPOTENT: tras la limpieza quirúrgica esperaba exactamente 3 definiciones (1 por función), hay $OVERLOAD_COUNT."
            exit 1
          fi
          echo "Limpieza quirúrgica OK: 1 sola definición viva de cada una de las 3 funciones (overloads fantasma reconciliados)."
          # revoke-outbox-cross-tenant (hotfix 2026-08-24, tramo h2 de
          # tenancy-guard-caja-outbox): ÚLTIMO eslabón de la cadena, y hereda
          # el puesto del anterior por las mismas dos razones, una más fuerte
          # que la otra.
          #   1. Es la migración de ACL más nueva, y toda esta cadena existe
          #      porque reaplicar migraciones viejas re-otorga GRANTs en
          #      silencio (20261001000001 L137/L1914 y 20261004000001 L1778,
          #      con su bloque REVOKE+GRANT "de plantilla"). Ninguno de los
          #      eslabones de arriba toca HOY el ACL de
          #      rpc_process_outbox_batch / rpc_mark_event_processed —el único
          #      archivo que se los otorga es 20260718000001, que no está en
          #      esta cadena—, así que el REVOKE no depende del orden para ser
          #      correcto. Va último igual, porque el invariante "la más nueva
          #      cierra" es lo que protege contra el eslabón futuro que vuelva
          #      a arrastrar el patrón uniforme, que es exactamente cómo se
          #      rompió _journal_post_from_event.
          #   2. Su gate final AUDITA el estado acumulado que dejan los
          #      eslabones previos: verifica que rpc_process_outbox_dispatch
          #      siga sin exponer, y —heredado del hotfix #454— que
          #      _pay_register_party_charge y _journal_post_from_event sigan
          #      cerrados. Esa verificación sólo tiene sentido corriendo
          #      DESPUÉS de 20261010000001 y 20261011000001; puesta antes,
          #      auditaría un estado intermedio y daría verde en falso.
          # Sin conflicto de firma/overload: este archivo no crea ni reemplaza
          # ninguna función (sólo REVOKE + COMMENT + un DO de verificación), así
          # que no puede generar overloads fantasma. Re-appliable por
          # construcción — REVOKE y COMMENT son absolutos, no incrementales
          # (verificado en local: tres aplicaciones seguidas sin error y sin
          # cambio de fingerprint de cuerpos, ACLs y comments).
          psql -v ON_ERROR_STOP=1 "$DSN" -f supabase/migrations/20261012000001_revoke_outbox_cross_tenant.sql
          # tenancy-guard-caja-outbox h1 (2026-08-24): ÚLTIMO eslabón de la
          # cadena, y acá el orden NO es una convención — es una precondición
          # dura, más fuerte que en los dos eslabones anteriores.
          #   1. Esta migración reescribe _c29_confirm_order_core y
          #      c28_register_cash_movement para meterles el guard de tenencia
          #      de la sesión de caja, y CUATRO eslabones de más arriba de esta
          #      misma cadena redefinen una u otra: 20261002000001 y
          #      20261003000001 (el core, vía los lotes del POS),
          #      20261004000001 (asiento-venta-formulario) y 20261006000001
          #      (el helper, banco-caja-historial-ajustes). Puesta antes, la
          #      cadena le BORRARÍA los dos guards en silencio y el gate del
          #      change fallaría por orden, no por regresión. Es el mismo
          #      mecanismo "phantom regression" de los GRANTs, pero sobre
          #      cuerpos de función en vez de sobre ACLs.
          #   2. Su gate final AUDITA además el estado acumulado que dejan los
          #      eslabones previos: verifica que los dos helpers de dinero
          #      cerrados por 20261010000001 (#454) y las dos RPCs del outbox
          #      cerradas por 20261012000001 (#460) sigan sin EXECUTE para
          #      anon/authenticated. Esa verificación sólo tiene sentido
          #      corriendo DESPUÉS de las dos; puesta antes daría verde en
          #      falso sobre un estado intermedio.
          # Sin conflicto de firma/overload: ninguna de las dos funciones
          # cambia de firma (CREATE OR REPLACE puro, con gate anti-overload
          # propio). Re-appliable por construcción — CREATE OR REPLACE, REVOKE,
          # GRANT y COMMENT son absolutos, no incrementales (verificado en
          # local: tres aplicaciones seguidas sin error y sin cambio del
          # fingerprint de cuerpos, ACLs y comments).
          psql -v ON_ERROR_STOP=1 "$DSN" -f supabase/migrations/20261013000001_tenancy_guard_caja_sesion.sql
          # sucursal-guard-vaciado-auditoria (2026-08-25): ÚLTIMO eslabón —
          # verifica la propia idempotencia del archivo en CI (task 4.14),
          # mismo motivo que los eslabones anteriores. No comparte NINGUNA
          # función con los eslabones previos de esta cadena (`branches` no
          # había sido tocada por ningún change anterior de la cadena), así
          # que el orden relativo a ellos no genera phantom regression — se
          # agrega al final por convención de la casa, no por precondición
          # dura. Contiene su propio gate anti-overload + ACL (sección 10 del
          # archivo). Verificado en local: `supabase db reset` + dos
          # reaplicaciones directas seguidas, sin error y sin cambio de
          # fingerprint de cuerpos/ACLs/triggers/comments.
          psql -v ON_ERROR_STOP=1 "$DSN" -f supabase/migrations/20261014000001_sucursal_guard_vaciado_auditoria.sql
          # gastos-forma-pago (2026-08-29): ÚLTIMO eslabón de la cadena, y acá
          # el orden es una PRECONDICIÓN DURA, no una convención — más fuerte
          # todavía que en el eslabón de tenancy-guard-caja-sesion.
          #   1. Esta migración amplía el CHECK cash_movements_movement_type_
          #      check de 7 a 8 tipos (agrega 'expense_reversal', el contra-
          #      movimiento de caja al borrar un gasto en efectivo, D8) con el
          #      molde DROP CONSTRAINT + ADD CONSTRAINT. DOS eslabones de más
          #      arriba de esta misma cadena vuelven a escribir ESE MISMO
          #      constraint con SU lista vigente en su fecha: 20261005000001
          #      (delete-guard-ledgers) lo re-angosta a 6 tipos y
          #      20261006000001 (banco-caja-historial-ajustes) a 7 — ninguno
          #      de los dos conoce 'expense_reversal'. Puesta antes de ellos,
          #      la cadena le BORRARÍA el octavo tipo en silencio y el gate de
          #      abajo fallaría por orden, no por regresión: el borrado de un
          #      gasto en efectivo reventaría con violación de CHECK. Es el
          #      mismo mecanismo "phantom regression" ya documentado seis
          #      veces en este paso, pero sobre un CHECK de tabla en vez de
          #      sobre cuerpos de función o ACLs.
          #   2. Esta migración además hace DROP+CREATE de
          #      rpc_payment_method_report para agregarle la columna
          #      total_spent (7 -> 8 columnas del RETURNS TABLE, D14). La
          #      ÚNICA otra migración del repo que declara esa función es
          #      20260928000001, que está en esta cadena y la crea con la
          #      firma vieja de 7 columnas — un CREATE OR REPLACE con distinto
          #      RETURNS TABLE es 42P13 (cannot change return type), no un
          #      overload. 🛑 Ese choque NO ocurre, y está MEDIDO, no supuesto
          #      (task 1.5, corrida DESPUÉS de aplicar esta migración): el
          #      reapply de 20260928000001 aborta en su LÍNEA 1838 — el gate
          #      ANTI-OVERLOAD de su sección 9, cuyo fallo ya se tolera arriba
          #      por el marcador literal — y el CREATE de
          #      rpc_payment_method_report vive en su LÍNEA 1850, o sea 12
          #      líneas DESPUÉS: con ON_ERROR_STOP=1 las secciones 10-12 no
          #      llegan a ejecutarse nunca. Si un cambio futuro moviera ese
          #      gate después del CREATE (o lo quitara), el reapply fallaría
          #      con 42P13 y habría que ampliar la tolerancia a ese SQLSTATE
          #      de forma ACOTADA (grep del marcador, como ya se hace) y
          #      reconverger reaplicando 20261015000001 — precedente
          #      documentado más arriba para 20260930000001.
          # Sin conflicto de firma/overload por sí misma: las 3 RPCs de gasto
          # (rpc_create_expense / rpc_update_expense / rpc_delete_expense) son
          # firmas NUEVAS que ninguna migración previa declara, y el archivo
          # trae sus propios gates ANTI-OVERLOAD (secciones 5 y 6) que fallan
          # el paso si quedara más de una definición de cualquiera de las 4
          # funciones — así que la reconvergencia no es una promesa sino una
          # aserción. Re-appliable por construcción (ADD COLUMN IF NOT EXISTS,
          # CREATE INDEX IF NOT EXISTS, DROP+ADD del CHECK, CREATE OR REPLACE
          # de las RPCs nuevas, DROP+CREATE del reporte con sus 3 sentencias
          # de ACL) — verificado en local con la huella md5 de todo lo que la
          # migración crea o toca (4 cuerpos + proacl + COMMENT de cada uno,
          # la columna, el índice, el CHECK con su COMMENT, la FK y el conteo
          # de definiciones): IDÉNTICA tras 0, 1 y 2 reaplicaciones.
          psql -v ON_ERROR_STOP=1 "$DSN" -f supabase/migrations/20261015000001_gastos_forma_pago.sql
          # qa-integral-modulos: ÚLTIMO eslabón de la cadena — reescribe
          # CUATRO funciones desde el baseline VIVO de prod:
          # rpc_branch_report (fix 42702, H4), rpc_product_profitability
          # (fix 42804), rpc_create_expense (§5) y rpc_delete_expense (§6),
          # las dos últimas para que el motivo del gasto llegue a los libros
          # (H11 / G16), + backfill idempotente de los movimientos ya
          # creados (OQ-3, §3).
          # DEBE quedar al final: rpc_create_expense y rpc_delete_expense
          # también viven en 20261015000001 (reaplicada justo arriba), así
          # que sin este orden el reapply dejaría los cuerpos VIEJOS y el
          # gate de test_qa_integral_fixes.sql §(3) se pondría rojo por
          # phantom regression. rpc_branch_report y rpc_product_profitability
          # no las toca ninguna otra migración de la cadena (su último
          # archivo previo, 20260814000001, no se reaplica acá).
          # Re-appliable por construcción (CREATE OR REPLACE + UPDATEs
          # acotados por description IS NULL) — verificado en local con
          # fingerprint md5 (4 cuerpos + proacl + conteos de movimientos):
          # idéntico tras 1 y 2 reaplicaciones. Trae su propio gate
          # ANTI-OVERLOAD (sección 7 — la numeración del archivo salta la 4).
          psql -v ON_ERROR_STOP=1 "$DSN" -f supabase/migrations/20261016000001_qa_integral_fixes.sql

          # fix-ci-idempotencia-reapply-firmas (2026-09-02, capa 2):
          # RECONVERGENCIA ESTRUCTURAL, no puntual. La cadena de arriba
          # reaplica migraciones VIEJAS fuera de orden para probar
          # idempotencia; eso deja overloads fantasma (3 ya tolerados y
          # limpiados quirúrgicamente arriba) y — recién descubierto — objetos
          # NO-función revertidos: 20261019000001 (cobranzas-reverso, fuera de
          # esta cadena) dejó cash_movements_movement_type_check en 13 tipos,
          # y el reapply de 20261006000001/20261015000001 más arriba en esta
          # misma cadena lo re-angosta a 7/8 con SU PROPIO DROP CONSTRAINT +
          # ADD CONSTRAINT — sin ningún gate ANTI-OVERLOAD que lo note (un
          # CHECK no tiene overloads). Reconstruir a mano la definición
          # "verdadera" de cada objeto revertido es frágil por partida doble:
          # (a) hay que enumerarlos TODOS (constraints hoy, ¿índices, políticas
          # RLS, comments, mañana?), y (b) incluso sabiendo CUÁL objeto,
          # copiar la definición de la migración que "parece" la más nueva es
          # una trampa — se verificó acá mismo que 20261018000001 YA NO es la
          # fuente de verdad de este CHECK: 20261019000001 lo vuelve a tocar
          # después. Whack-a-mole real, no hipotético.
          #
          # En vez de perseguir objeto por objeto, se reconstruye la DB entera:
          # `supabase db reset` reaplica TODA la migration history real, en su
          # orden cronológico verdadero — exactamente el mismo mecanismo que ya
          # usó `supabase start` al principio del job para llegar al estado
          # correcto. Es agnóstico de QUÉ objeto haya revertido (no hace falta
          # enumerarlos de antemano) y no puede quedar "un paso atrás" como una
          # reconvergencia a mano, porque no es incremental. Cuesta ~60-90s
          # extra — verificado en local (Postgres 17.6 en Docker) — pero es la
          # única forma de no volver a escribir este bloque cada vez que una
          # migración nueva le cambie la definición a algo que una migración
          # VIEJA de esta cadena también toca (y van dos capas: funciones acá
          # arriba, constraints acá abajo).
          #
          # La aserción real es la que sigue, no la reconstrucción en sí: el
          # schema (constraints + firmas de función + ACLs, capturado por
          # schema_snapshot()) tiene que quedar IDÉNTICO al de antes de
          # arrancar este paso. No es una promesa, es una aserción — si
          # `supabase db reset` alguna vez no alcanzara para reconverger algo
          # (por lo que sea), este diff lo va a mostrar en vez de dejarlo pasar
          # en verde.
          echo "Reconvergiendo: supabase db reset (reconstruye la DB desde cero con la migration history real, mismo mecanismo que 'supabase start')..."
          supabase db reset
          schema_snapshot > /tmp/schema_after_reconverge.txt
          if ! diff -u /tmp/schema_before_reapply.txt /tmp/schema_after_reconverge.txt > /tmp/schema_diff.txt; then
            echo "NOT IDEMPOTENT: el schema (constraints + firmas de función + ACLs) quedó distinto del estado previo a este paso, incluso después de la reconvergencia:"
            cat /tmp/schema_diff.txt
            exit 1
          fi
          echo "Reconvergencia OK: constraints + firmas de función + ACLs quedaron IDÉNTICOS al estado previo a este paso."

      # -v ON_ERROR_STOP=1 is required: without it psql prints RAISE EXCEPTION
      # errors but still exits 0, so failing assertions show green in CI.
      - name: Run deterministic KPI tests
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_kpis.sql

      - name: Run edge case KPI tests
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_kpis_edge_cases.sql

      # Anti-regresión advisors 0028/0029: DROP+CREATE resetea ACLs (EXECUTE a
      # PUBLIC). Falla si un trigger SECURITY DEFINER queda expuesto o si una
      # función SECURITY DEFINER queda anon-executable fuera de la allowlist.
      - name: Run function ACL anti-regression gate
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_function_acl_gate.sql

      # limpiezas-pagos-admin (G3, D5): gate PERMANENTE — falla el pipeline si
      # cualquier función viva de public/community usa un ERRCODE custom de
      # menos de 5 caracteres. Postgres los rechaza en runtime (42704
      # unrecognized_exception, mensaje original perdido, degrada a 500
      # genérico en backend/core/errors.py). La corrección puntual de
      # 20260624000001 se perdió porque nada la sostenía — este gate es la
      # red permanente, mismo patrón que test_function_acl_gate.sql.
      - name: Run ERRCODE 5-char anti-regression gate
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_errcode_5char_gate.sql

      # Invariantes del ledger de idempotencia (H-1 QA #361): contrato por-fila
      # de operation_id, kinds del CHECK en sincronía con los escritores, y
      # conflict targets de los RPCs contra el UNIQUE real de 3 columnas.
      # rpc_issue_credit_note vivió rota ~1 mes (kind fuera del CHECK + ON
      # CONFLICT contra un constraint eliminado) sin que nada lo detectara:
      # este test solo corría a mano.
      - name: Run idempotency ledger invariants
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_idempotency.sql

      # deudas-menores-agosto (G1): sale_items_rpc_v2 pasa de opt-in a
      # opt-out — ausencia de fila en account_feature_flags deja de
      # significar legacy y pasa a significar v2. Verifica, para
      # rpc_create_sale_operation Y rpc_create_purchase_operation (mismo
      # flag_key): cuenta sin fila escribe línea, kill-switch explícito
      # (enabled=false) sigue en legacy, línea de servicio no genera fila,
      # idempotencia intacta, y el stock se mueve igual que antes. Hallazgo
      # documentado en la migración: rpc_create_purchase_operation vigente en
      # prod no tenía dispatch a ningún flag — se agregó junto con el
      # INSERT condicionado de purchase_items (ver cabecera de
      # 20260924000001_activate_sale_items_rpc_v2.sql).
      - name: Run sale_items_rpc_v2 activation gates
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_sale_items_rpc_v2_activation.sql

      # edicion-operaciones-lineas (OQ-1 de deudas-menores-agosto): las RPCs de
      # EDICIÓN (rpc_atomic_update_sale_operation / rpc_atomic_update_
      # purchase_operation) implementan REVERSE→DELETE→APPLY; sale_items.
      # sale_id / purchase_items.purchase_id son FK ON DELETE CASCADE, así que
      # cada edición borraba la línea sin recrearla. Verifica: acarreo del
      # snapshot por product_id cuando el producto no cambia (incluso con
      # products.cost movido entre la creación y la edición — control
      # positivo), snapshot fresco cuando cambia o cuando la operación nunca
      # tuvo línea, colisión determinística (dos filas viejas con el mismo
      # product_id), caso mixto (un ítem acarrea y otro re-snapshotea en la
      # misma edición), compras con el header purchases también poblado
      # (incondicional, D5), kill-switch (mismo flag que la creación),
      # higiene referencial, doble submit y los guards P0400/P0403/P0409/
      # P0422 intactos en la edición.
      - name: Run operation edit lines gates
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_operation_edit_lines.sql

      # stock-movements-edicion (OQ-B de edicion-operaciones-lineas): las RPCs
      # de EDICIÓN (rpc_atomic_update_sale_operation / rpc_atomic_update_
      # purchase_operation) mueven branch_stock pero nunca escribían una fila
      # en stock_movements — SalesRepository.delete_by_id / PurchaseRepository.
      # delete_by_id derivan la reversa LEYENDO stock_movements, así que una
      # operación editada quedaba sin movimiento de referencia y su
      # eliminación no reponía stock, en silencio (204 operaciones vivas en
      # prod). Verifica el par espejo REVERSE (sale_return/purchase_return,
      # reference_type sale_update/purchase_update, id viejo) + APPLY (sale/
      # purchase, reference_type sale/purchase, id nuevo — indistinguible de
      # la creación), unit_cost_snapshot acarreado (no re-valuado), línea de
      # servicio sin movimientos, Σ quantity_delta reconstruye el delta de
      # branch_stock, cero huérfanos nuevos, agregar/quitar línea, colisión
      # legacy, doble edición encadenada, y el gate estrella: eliminar una
      # operación previamente EDITADA repone el stock.
      - name: Run stock movements edicion gates
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_stock_movements_edicion.sql

      # metodos-pago-operaciones: catálogo payment_methods (espejo de
      # cost_centers + sort_order + soft delete), RLS activa, CHECK del
