      - name: Run admin KPI refresh gates
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_admin_kpis.sql

      # community-counter-triggers-schema-fix: ALTER TABLE ... SET SCHEMA mueve
      # la tabla y conserva los triggers colgados de ella, pero NO reescribe el
      # cuerpo de las funciones que ejecutan. C-23 movió 16 tablas a community.*
      # y dejó las dos funciones de contador escribiendo en public.posts: como
      # son triggers AFTER, el 42P01 abortaba la transacción y responder un post
      # o dar like no persistía nada (roto en prod desde 2026-06-15). Este gate
      # verifica el camino feliz con CONTEOS EXACTOS (el guard degrade-don't-fail
      # convierte un fallo del contador en WARNING, así que sin valores exactos
      # una regresión pasaría en verde), que un fallo del contador no tumbe la
      # fila de negocio, y — la red generalizada — que ninguna función de
      # pg_proc en public/community referencie public.<tabla> para ninguna de
      # las 16 tablas movidas. Cubre la FAMILIA del bug, no solo su síntoma.
      - name: Run community interactions gates
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_community_interactions.sql

      # Postmortem `organizations`: un repositorio del backend consultaba una
      # tabla `organizations` que nunca existió en el schema real durante ~2
      # meses — los tests unitarios mockeaban asyncpg, así que nada ejecutaba
      # la query contra una base real y el bug quedó invisible. Este gate
      # escanea backend/**/*.py (regex sobre el texto fuente, stdlib-only) en
      # busca de referencias FROM/JOIN/UPDATE/INSERT INTO/DELETE FROM/
      # TRUNCATE y de llamadas RPC `rpc_*`, y las valida contra pg_class/
      # pg_proc del schema real que acaba de armar `supabase start`.
      - name: Run backend table/function reference gate
        run: python3 scripts/ci/check_backend_table_refs.py --dsn postgresql://postgres:postgres@127.0.0.1:54322/postgres

      # Mismo postmortem `organizations`, ahora del lado del frontend: el
      # frontend le habla a Supabase vía PostgREST usando strings literales
      # (`supabase.from("tabla_fantasma")` / `supabase.rpc("fn_fantasma")`) —
      # un typo o una tabla renombrada ahí solo se descubre en runtime, ni
      # TypeScript ni los tests unitarios (que mockean supabase-js) lo
      # detectan. Este gate escanea frontend/**/*.{ts,tsx} (regex sobre el
      # texto fuente, stdlib-only) en busca de esas llamadas y las valida
      # contra pg_class/pg_proc del schema real que acaba de armar
      # `supabase start`.
      - name: Run frontend table/function reference gate
        run: python3 scripts/ci/check_frontend_table_refs.py --dsn postgresql://postgres:postgres@127.0.0.1:54322/postgres

      # internal-logs-retention: diagnóstico medido en prod (2026-08-17) —
      # 48/86 MB de la DB eran logs internos de mantenimiento. Verifica la
      # función canónica public.purge_internal_logs() (estructural + ACLs),
      # la retención ESCALONADA de cron.job_run_details (1 día jobs de alta
      # frecuencia / 14 días resto y huérfanas — reemplaza la ventana plana
      # de 7 días de 20260630000001), el techo de 90 días de email_logs, el
      # job de VACUUM (FULL) sobre net._http_response (pg_net.ttl nativo ya
      # retiene las filas — sin purga por antigüedad ahí) y el re-registro
      # idempotente de los jobs. Guard defensivo si el schema net no está
      # precreado en el stack local (D7/OQ-3).
      - name: Run internal logs retention gates
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_internal_logs_retention.sql

      # edicion-preserva-contexto: rpc_atomic_update_sale_operation /
      # rpc_atomic_update_purchase_operation preservan el contexto del header
      # (branch_id, canal, unit_id, supplier_id, cost_center_id) al editar en
      # vez de dejarlo NULL en silencio — branch_id/canal se vuelven además
      # editables con el mismo contrato tri-estado que #419 le dio a
      # payment_method_id. Una venta con comprobante fiscal pending_cae/
      # authorized es inmutable (P0423 antes del REVERSE; rejected y sin
      # comprobante no bloquean). La pata APPLY del ledger aterriza en la
      # sucursal EFECTIVA (no en la default) y la sales_orders promovida sin
      # comprobante real se re-apunta al operation_id nuevo. quantity acepta
      # decimales en la ruta de edición, igual que en la de creación.
      #
      # Incluye (§0 de la migración) la reparación de un gap de historial
      # descubierto en RED: sales.quantity/purchases.quantity ya son
      # numeric(15,4) en prod pero ningún archivo de migración lo registraba
      # — el stack local/CI reconstruido desde cero los dejaba en integer,
      # redondeando en silencio. Gateado por el tipo actual de la columna:
      # no-op en prod, repara acá reconstruyendo v_sales_flat/v_purchases_flat
      # con su definición exacta (incluido security_invoker=true).
      - name: Run edicion-preserva-contexto gates
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_edicion_preserva_contexto.sql

      # pagos-cableados-restantes: helper compartido _pay_register_party_charge
      # (cliente/proveedor, invalid_party_kind, balance_after acumulado),
      # formulario de venta a crédito (postea cargo, guard credit_requires_client
      # antes del descuento de stock, no-crédito no toca la cuenta — en ambas
      # ramas del strangler, incl. la legacy con el flag off), opt-in de caja
      # (las tres condiciones de servidor + expected_balance con/sin opt-in),
      # rpc_create_purchase_operation emite el kind real (ya no hardcodea
      # 'credit'), _journal_post_from_event rutea wallet a 1110 Banco en las
      # tres ramas con predicado bancario (PurchaseCreated queda sin cambios,
      # documentado), y D6 (inmutabilidad de operaciones con cargo o
      # movimiento posteado, cubriendo las DOS convenciones de reference_id —
      # operation_id del formulario y sales_orders.id del POS — en venta y
      # compra, con el control negativo de que una operación sin cargo sigue
      # editable).
      - name: Run pagos-cableados-restantes gates
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_pagos_cableados_restantes.sql

      # pos-banco-movimientos: la venta y la compra por método bancario
      # escriben su bank_movement intra-transacción (0 filas en prod hoy —
      # gate ESTRELLA). Verifica: default por método + override + sin cuenta
      # resuelta = no-op byte a byte (D2), mapa kind→movement_type (D3:
      # transfer/wallet → transfer_in/out, card bruto → card_settlement),
      # venta a crédito + cobro posterior = exactamente UN movimiento (sin
      # doble contabilización), contrato con la conciliación de C3 (match 1:1
      # deja el movimiento matched, sin piezas nuevas), P0423 extendido a
      # bank_movements en la edición de venta y de compra (con el control
      # negativo de que una operación sin ningún cargo/movimiento sigue
      # editable) y P0424 sobre un período ya conciliado y cerrado.
      - name: Run pos-banco-movimientos gates
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_pos_banco_movimientos.sql

      # asiento-venta-formulario: rpc_create_sale_operation_v2 (ruta viva del
      # formulario de venta) no emitía ningún evento al outbox — 228 ventas
      # del formulario sin asiento contable, 66% de las operaciones de venta
      # de la app. Verifica: (1) el gap raíz cerrado — una venta del
      # formulario produce 1 asiento balanceado vía el relay real; (2) ruteo
      # por kind (credit/transfer/cash/sin-imputar -> 1300/1110/1100/1100,
      # crédito único 4100 sin IVA — sin-imputar rutea a Caja, no a
      # Deudores, D3); (3) posted_at = fecha de la venta, no el instante del
      # relay; (4) override del PO (2026-08-20, reemplaza la inmutabilidad
      # que el design original recomendaba): editar una operación con
      # rastro contable AJUSTA el asiento en vez de bloquear la edición —
      # reemplazo in-place del evento pendiente si el relay no procesó
      # todavía (4a), contra-entry + asiento nuevo si ya procesó (4b), y dos
      # gates de cadena de ediciones — GATE ESTRELLA (4c: la segunda
      # contra-entry revierte el asiento de la primera edición, no el
      # original; 4d: dos ediciones antes de procesar colapsan en un solo
      # evento de ajuste, sin eventos fantasma); (5) control negativo — el
      # POS sigue emitiendo SOLO SaleConfirmed, nunca SaleOperationCreated,
      # sin doble posteo.
      - name: Run asiento-venta-formulario gates
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_asiento_venta_formulario.sql

      # delete-guard-ledgers: borrar una operación con dinero posteado no
      # compensaba ningún libro (cargo fantasma real de $75.150 el
      # 2026-08-21). Verifica: (GATE ESTRELLA) una operación con dinero en
      # LOS CUATRO LIBROS a la vez (cuenta corriente, caja, banco, contable)
      # vuelve a cero neto tras borrarla, con contra-asiento balanceado y
      # kardex repuesto; (P0423) venta con comprobante fiscal emitido no se
      # puede borrar; (P0425) venta a crédito ya cobrada no se puede
      # borrar — el saldo no se toca; (P0426) sin sesión de caja abierta no
      # se puede borrar, y con una sesión cerrada + otra abierta la
