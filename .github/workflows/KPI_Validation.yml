name: KPI Validation

on:
  pull_request:
    branches: [main]

jobs:
  validate-kpis:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check hidden BOM characters
        run: |
          if grep -rIl $'\xEF\xBB\xBF' supabase/migrations supabase/tests; then
            echo "BOM detected in SQL files"
            exit 1
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.105.0

      - name: Start Supabase
        run: supabase start

      # deudas-menores-agosto (G1 + G4): las dos migraciones nuevas deben ser
      # reejecutables (CREATE OR REPLACE / ON CONFLICT DO UPDATE / DELETE
      # re-derivado / UPDATE ... WHERE account_id IS NULL). `supabase start`
      # ya las aplicó una vez al levantar el stack; esto las reaplica a mano
      # y compara un fingerprint de estado antes/después — debe ser idéntico
      # (tasks 2.5 y 5.6: verificación de idempotencia real, no declarada).
      - name: Verify G1/G4 migrations are idempotent on reapply
        run: |
          set -e
          DSN=postgresql://postgres:postgres@127.0.0.1:54322/postgres
          FINGERPRINT="SELECT (SELECT count(*) FROM public.analytics_events WHERE event_name='operation_created') || '|' || (SELECT count(*) FROM public.sale_items WHERE account_id IS NULL) || '|' || (SELECT count(*) FROM public.purchase_items WHERE account_id IS NULL) || '|' || (SELECT count(*) FROM public.account_feature_flags WHERE flag_key='sale_items_rpc_v2')"
          BEFORE=$(psql -tA "$DSN" -c "$FINGERPRINT")
          psql -v ON_ERROR_STOP=1 "$DSN" -f supabase/migrations/20260924000001_activate_sale_items_rpc_v2.sql
          psql -v ON_ERROR_STOP=1 "$DSN" -f supabase/migrations/20260925000001_cleanup_analytics_and_line_account_id.sql
          AFTER=$(psql -tA "$DSN" -c "$FINGERPRINT")
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "NOT IDEMPOTENT: fingerprint changed on reapply ($BEFORE -> $AFTER)"
            exit 1
          fi
          echo "Idempotent: fingerprint unchanged on reapply ($BEFORE)"

      # -v ON_ERROR_STOP=1 is required: without it psql prints RAISE EXCEPTION
      # errors but still exits 0, so failing assertions show green in CI.
      - name: Run deterministic KPI tests
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_kpis.sql

      - name: Run edge case KPI tests
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_kpis_edge_cases.sql

      # Anti-regresión advisors 0028/0029: DROP+CREATE resetea ACLs (EXECUTE a
      # PUBLIC). Falla si un trigger SECURITY DEFINER queda expuesto o si una
      # función SECURITY DEFINER queda anon-executable fuera de la allowlist.
      - name: Run function ACL anti-regression gate
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_function_acl_gate.sql

      # Invariantes del ledger de idempotencia (H-1 QA #361): contrato por-fila
      # de operation_id, kinds del CHECK en sincronía con los escritores, y
      # conflict targets de los RPCs contra el UNIQUE real de 3 columnas.
      # rpc_issue_credit_note vivió rota ~1 mes (kind fuera del CHECK + ON
      # CONFLICT contra un constraint eliminado) sin que nada lo detectara:
      # este test solo corría a mano.
      - name: Run idempotency ledger invariants
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_idempotency.sql

      # deudas-menores-agosto (G1): sale_items_rpc_v2 pasa de opt-in a
      # opt-out — ausencia de fila en account_feature_flags deja de
      # significar legacy y pasa a significar v2. Verifica, para
      # rpc_create_sale_operation Y rpc_create_purchase_operation (mismo
      # flag_key): cuenta sin fila escribe línea, kill-switch explícito
      # (enabled=false) sigue en legacy, línea de servicio no genera fila,
      # idempotencia intacta, y el stock se mueve igual que antes. Hallazgo
      # documentado en la migración: rpc_create_purchase_operation vigente en
      # prod no tenía dispatch a ningún flag — se agregó junto con el
      # INSERT condicionado de purchase_items (ver cabecera de
      # 20260924000001_activate_sale_items_rpc_v2.sql).
      - name: Run sale_items_rpc_v2 activation gates
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_sale_items_rpc_v2_activation.sql

      # edicion-operaciones-lineas (OQ-1 de deudas-menores-agosto): las RPCs de
      # EDICIÓN (rpc_atomic_update_sale_operation / rpc_atomic_update_
      # purchase_operation) implementan REVERSE→DELETE→APPLY; sale_items.
      # sale_id / purchase_items.purchase_id son FK ON DELETE CASCADE, así que
      # cada edición borraba la línea sin recrearla. Verifica: acarreo del
      # snapshot por product_id cuando el producto no cambia (incluso con
      # products.cost movido entre la creación y la edición — control
      # positivo), snapshot fresco cuando cambia o cuando la operación nunca
      # tuvo línea, colisión determinística (dos filas viejas con el mismo
      # product_id), caso mixto (un ítem acarrea y otro re-snapshotea en la
      # misma edición), compras con el header purchases también poblado
      # (incondicional, D5), kill-switch (mismo flag que la creación),
      # higiene referencial, doble submit y los guards P0400/P0403/P0409/
      # P0422 intactos en la edición.
      - name: Run operation edit lines gates
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_operation_edit_lines.sql

      # analytics-events-revival: choke point único de telemetría de producto
      # (trigger AFTER INSERT en sales/purchases/expenses). Verifica emisión,
      # unicidad de activación, atomicidad, degrade-don't-fail, ACL/RLS,
      # idempotencia y granularidad — el hallazgo F5 del informe de KPIs
      # (docs/plan-remediacion-kpis-2026-08-11.md) que dejaba activación/UMV/
      # retención midiendo ruido para toda ruta de escritura moderna.
      - name: Run analytics events revival gates
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_analytics_events.sql

      # admin-kpi-refresh (hallazgo F6, docs/plan-remediacion-kpis-2026-08-11.md
      # Fase 4): las definiciones de los KPI de los paneles admin viven en SQL,
      # no en el cliente. Verifica personas-vs-eventos (usuarios de comunidad
      # como COUNT DISTINCT, no suma de activos por período), activaciones/UMV
      # como conteos distintos sobre el rango, cobertura de datos declarada,
      # madurez de cohorte (observation_window_days/is_mature), comunidad
      # medida sobre community.posts/replies (roto por C-23 hasta esta
      # migración) y superficie de autorización (1 definición, ACLs, rechazo
      # de no-admin) en las 5 RPCs admin redefinidas.
      - name: Run admin KPI refresh gates
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_admin_kpis.sql

      # community-counter-triggers-schema-fix: ALTER TABLE ... SET SCHEMA mueve
      # la tabla y conserva los triggers colgados de ella, pero NO reescribe el
      # cuerpo de las funciones que ejecutan. C-23 movió 16 tablas a community.*
      # y dejó las dos funciones de contador escribiendo en public.posts: como
      # son triggers AFTER, el 42P01 abortaba la transacción y responder un post
      # o dar like no persistía nada (roto en prod desde 2026-06-15). Este gate
      # verifica el camino feliz con CONTEOS EXACTOS (el guard degrade-don't-fail
      # convierte un fallo del contador en WARNING, así que sin valores exactos
      # una regresión pasaría en verde), que un fallo del contador no tumbe la
      # fila de negocio, y — la red generalizada — que ninguna función de
      # pg_proc en public/community referencie public.<tabla> para ninguna de
      # las 16 tablas movidas. Cubre la FAMILIA del bug, no solo su síntoma.
      - name: Run community interactions gates
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_community_interactions.sql

      # Postmortem `organizations`: un repositorio del backend consultaba una
      # tabla `organizations` que nunca existió en el schema real durante ~2
      # meses — los tests unitarios mockeaban asyncpg, así que nada ejecutaba
      # la query contra una base real y el bug quedó invisible. Este gate
      # escanea backend/**/*.py (regex sobre el texto fuente, stdlib-only) en
      # busca de referencias FROM/JOIN/UPDATE/INSERT INTO/DELETE FROM/
      # TRUNCATE y de llamadas RPC `rpc_*`, y las valida contra pg_class/
      # pg_proc del schema real que acaba de armar `supabase start`.
      - name: Run backend table/function reference gate
        run: python3 scripts/ci/check_backend_table_refs.py --dsn postgresql://postgres:postgres@127.0.0.1:54322/postgres

      # Mismo postmortem `organizations`, ahora del lado del frontend: el
      # frontend le habla a Supabase vía PostgREST usando strings literales
      # (`supabase.from("tabla_fantasma")` / `supabase.rpc("fn_fantasma")`) —
      # un typo o una tabla renombrada ahí solo se descubre en runtime, ni
      # TypeScript ni los tests unitarios (que mockean supabase-js) lo
      # detectan. Este gate escanea frontend/**/*.{ts,tsx} (regex sobre el
      # texto fuente, stdlib-only) en busca de esas llamadas y las valida
      # contra pg_class/pg_proc del schema real que acaba de armar
      # `supabase start`.
      - name: Run frontend table/function reference gate
        run: python3 scripts/ci/check_frontend_table_refs.py --dsn postgresql://postgres:postgres@127.0.0.1:54322/postgres

      # internal-logs-retention: diagnóstico medido en prod (2026-08-17) —
      # 48/86 MB de la DB eran logs internos de mantenimiento. Verifica la
      # función canónica public.purge_internal_logs() (estructural + ACLs),
      # la retención ESCALONADA de cron.job_run_details (1 día jobs de alta
      # frecuencia / 14 días resto y huérfanas — reemplaza la ventana plana
      # de 7 días de 20260630000001), el techo de 90 días de email_logs, el
      # job de VACUUM (FULL) sobre net._http_response (pg_net.ttl nativo ya
      # retiene las filas — sin purga por antigüedad ahí) y el re-registro
      # idempotente de los jobs. Guard defensivo si el schema net no está
      # precreado en el stack local (D7/OQ-3).
      - name: Run internal logs retention gates
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_internal_logs_retention.sql
