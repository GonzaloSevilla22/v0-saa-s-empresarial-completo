      - name: Run payment methods catalog gates
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_payment_methods_catalog.sql

      # metodos-pago-operaciones: seed de 6 formas de pago — backfill
