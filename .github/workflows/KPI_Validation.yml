      # (debit_note de proveedor, cost_center_id preservado en la
      # reversión); operación sin dinero se borra como antes; id
      # inexistente devuelve false sin excepción.
      - name: Run delete-guard-ledgers gates
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_delete_guard_ledgers.sql

      # banco-caja-historial-ajustes: pedido textual del PO 2026-08-22 — Caja y
      # Banco pasan a módulos propios con historial completo (molde Stock) y
      # ajuste manual con motivo obligatorio en ambos libros, sin tapar la
