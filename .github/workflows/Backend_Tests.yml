# Gate de pytest del backend FastAPI — el "coverage mínimo verificado en CI"
# prometido en Fase 5 (CLAUDE.md) que nunca se materializó: la suite (~1269
# tests) solo corría a mano, el mismo patrón de gap que dejó invisibles al
# flake H-3 y a la RPC de credit_note rota (informe QA PR #361).
#
# La suite es HERMÉTICA: asyncpg/Redis/supabase mockeados (ver
# backend/tests/conftest.py — ASGITransport in-process, JWT de test con
# python-jose). No necesita supabase start ni servicios: corre en ~30s.
# Los tests `-m integration` (servicios externos reales) quedan fuera del
# gate por diseño — el marker lo documenta desde su creación.
#
# Coverage: solo código de app (omit de tests/ vía [tool.coverage.run] en
# backend/pyproject.toml — pasado explícito con --cov-config porque
# coverage.py no lo busca fuera del CWD). Línea base 2026-08-11: 88.84%.
# Piso 87%: bajar de ahí es una regresión real de cobertura, no ruido.
name: Backend Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/Backend_Tests.yml'
      # supabase/migrations/** entra por el candado anti-envejecimiento de
      # backend/tests/migrations/test_events_reconcile.py: sus aserciones
      # estructurales apuntan a DISPATCHER_MIGRATION_FILE (la redefinicion mas
      # nueva de rpc_process_outbox_dispatch) y TestDispatcherMigrationPointer
      # falla si aparece una mas nueva y nadie mueve el puntero. Sin este path,
      # un PR que SOLO agrega una migracion con CREATE OR REPLACE de esa
      # funcion no disparaba el job, asi que el candado no cerraba justo en los
      # PRs que lo rompen (hotfix del outbox, 2026-08-24). El job es hermetico
      # (asyncpg mockeado, sin servicios) y corre en ~30s: no encarece nada.
      - 'supabase/migrations/**'

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      # requirements.txt = deps de la app, incluido PyJWT[crypto] — que es lo
      # que usan la app (backend/core/auth.py) y también los tests para forjar
      # JWTs (backend/tests/conftest.py). El extra `[crypto]` es el que trae
      # `cryptography`, necesario para la rama ES256 de producción y para la
      # clave EC que genera backend/tests/test_auth_jwks.py.
      - name: Install dependencies
        run: pip install -r backend/requirements.txt pytest pytest-asyncio pytest-cov

      - name: Run pytest with coverage floor
        # auth-hardening-jwt-cookies D9: este job no declaraba NINGUNA
        # variable de entorno. Con el fail-fast de configuración puesto, un
        # entorno sin `SUPABASE_URL` aborta al importar `backend.core.config`
        # —que ocurre durante la RECOLECCIÓN—, así que sin esta declaración
        # el gate quedaría en rojo con 0 tests recolectados y el umbral de
        # cobertura nunca evaluado. La suite corre a propósito por la rama
        # HS256 (no hay JWKS que alcanzar desde CI), y declararlo acá lo
        # vuelve una decisión visible en vez de un default silencioso.
        # `conftest.py` hace el mismo `setdefault` para las corridas locales.
        env:
          AUTH_ALLOW_HS256_FALLBACK: "true"
        run: >
          python -m pytest backend/tests -m "not integration"
          --cov=backend
          --cov-config=backend/pyproject.toml
          --cov-report=term
          --cov-fail-under=87
