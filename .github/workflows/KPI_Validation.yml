name: KPI Validation

on:
  pull_request:
    branches: [main]

jobs:
  validate-kpis:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check hidden BOM characters
        run: |
          if grep -rIl $'\xEF\xBB\xBF' supabase/migrations supabase/tests; then
            echo "BOM detected in SQL files"
            exit 1
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.105.0

      - name: Start Supabase
        run: supabase start

      # deudas-menores-agosto (G1 + G4): las dos migraciones nuevas deben ser
      # reejecutables (CREATE OR REPLACE / ON CONFLICT DO UPDATE / DELETE
      # re-derivado / UPDATE ... WHERE account_id IS NULL). `supabase start`
      # ya las aplicó una vez al levantar el stack; esto las reaplica a mano
      # y compara un fingerprint de estado antes/después — debe ser idéntico
      # (tasks 2.5 y 5.6: verificación de idempotencia real, no declarada).
      #
      # metodos-pago-operaciones: 20260924000001 hace CREATE OR REPLACE de
      # rpc_create_sale_operation(_v2)/rpc_create_purchase_operation con SU
      # firma vigente en esa fecha (sin payment_method_id). Re-aplicarla acá
      # DESPUÉS de que 20260928000001 ya cambió esa firma no "reemplaza" nada
      # — CREATE OR REPLACE con una lista de argumentos distinta crea un
      # OVERLOAD nuevo (mismo mecanismo 42725 que el D4 de esta migración
      # evita con DROP+CREATE), y ese overload nuevo nace con el ACL default
      # (EXECUTE a PUBLIC → anon lo hereda) porque no hay una función con esa
      # firma exacta para "heredarle" el REVOKE — exactamente el patrón
      # advisor 0028/0029 que test_function_acl_gate.sql existe para atrapar.
      # Se re-aplica 20260928000001 al final para converger al estado
      # correcto (prueba, de paso, que la propia migración es re-appliable).
      - name: Verify G1/G4 migrations are idempotent on reapply
        run: |
          set -e
          DSN=postgresql://postgres:postgres@127.0.0.1:54322/postgres
          FINGERPRINT="SELECT (SELECT count(*) FROM public.analytics_events WHERE event_name='operation_created') || '|' || (SELECT count(*) FROM public.sale_items WHERE account_id IS NULL) || '|' || (SELECT count(*) FROM public.purchase_items WHERE account_id IS NULL) || '|' || (SELECT count(*) FROM public.account_feature_flags WHERE flag_key='sale_items_rpc_v2')"
          BEFORE=$(psql -tA "$DSN" -c "$FINGERPRINT")
          psql -v ON_ERROR_STOP=1 "$DSN" -f supabase/migrations/20260924000001_activate_sale_items_rpc_v2.sql
          psql -v ON_ERROR_STOP=1 "$DSN" -f supabase/migrations/20260925000001_cleanup_analytics_and_line_account_id.sql
          AFTER=$(psql -tA "$DSN" -c "$FINGERPRINT")
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "NOT IDEMPOTENT: fingerprint changed on reapply ($BEFORE -> $AFTER)"
            exit 1
          fi
          echo "Idempotent: fingerprint unchanged on reapply ($BEFORE)"
          # metodos-pago-operaciones: reconverger la firma de las RPCs de
          # creación tras el reapply de arriba (ver comentario extenso sobre
          # el paso).
          #
          # edicion-preserva-contexto: 20260928000001 también DROPea+CREATEa
          # rpc_atomic_update_sale_operation/rpc_atomic_update_purchase_
          # operation con SU firma vigente en esa fecha (7/6 args, sin
          # branch_id/canal) — y 20260930000001 (este change) volvió a
          # cambiar esa firma (11/8 args). Reaplicar 20260928000001 fuera de
          # su orden cronológico real (después de una migración MÁS NUEVA
          # que vuelve a tocar las mismas dos RPCs) hace que su propio gate
          # ANTI-OVERLOAD interno se dispare — detecta correctamente el
          # overload fantasma que la reaplicación misma crea (su `DROP
          # FUNCTION IF EXISTS` con la firma de esa fecha no matchea la
          # firma 11/8-arg vigente, así que el `CREATE OR REPLACE` que sigue
          # crea un segundo overload en vez de reemplazar). Es el mismo
          # mecanismo 42725 de la nota de arriba, un tramo más adelante en
          # la cadena — se tolera el fallo de ESTE paso puntual (no de los
          # demás) y se reconverge de inmediato reaplicando 20260930000001,
          # cuyo propio `DROP FUNCTION IF EXISTS` con la firma 7/6-arg SÍ
          # matchea el overload fantasma recién creado y lo limpia, dejando
          # exactamente 1 definición de cada función con el cuerpo final
          # correcto (de paso, prueba que 20260930000001 es re-appliable).
          if ! psql -v ON_ERROR_STOP=1 "$DSN" -f supabase/migrations/20260928000001_payment_methods_operaciones.sql; then
            echo "20260928000001 reapply disparó su propio gate ANTI-OVERLOAD (esperado: 20260930000001 ya cambió de nuevo la firma) — reconvergiendo con 20260930000001"
          fi
          psql -v ON_ERROR_STOP=1 "$DSN" -f supabase/migrations/20260930000001_edicion_preserva_contexto.sql
          # pagos-cableados-restantes: 20260930000001 (edicion-preserva-contexto)
          # NO toca rpc_create_sale_operation/rpc_create_purchase_operation —
          # sólo rpc_atomic_update_sale_operation/rpc_atomic_update_purchase_
          # operation (las RPCs de EDICIÓN, no de creación). El reapply de
          # 20260924000001 más arriba en esta misma secuencia SÍ redefine
          # rpc_create_sale_operation con SU firma vigente en esa fecha (7 args,
          # sin payment_method_id) — su propio DROP FUNCTION IF EXISTS matchea el
          # overload fantasma de esa reaplicación puntual, pero dispara a su vez
          # el gate ANTI-OVERLOAD de 20260928000001 (tolerado arriba) porque dejó
          # un segundo overload (8 args, con payment_method_id, sin
          # cash_session_id) que nada de lo que sigue vuelve a tocar. Reconverge
          # reaplicando esta migración al final de la cadena: su propio DROP
          # FUNCTION IF EXISTS con la firma 8-arg (SIN cash_session_id) matchea
          # exactamente ese overload fantasma y el CREATE OR REPLACE que sigue
          # deja 1 sola definición de cada función con el cuerpo final correcto
          # (de paso, prueba que esta migración es re-appliable).
          psql -v ON_ERROR_STOP=1 "$DSN" -f supabase/migrations/20261001000001_pagos_cableados_restantes.sql
          # pos-banco-movimientos: 20261001000001 (reaplicada arriba) redefine
          # _c29_confirm_order_core, rpc_create_sale_operation(_v2) y
          # rpc_create_purchase_operation con SU firma vigente en esa fecha
          # (sin p_bank_account_id) — mismo mecanismo de la nota anterior: su
          # CREATE OR REPLACE ya no matchea la firma NUEVA vigente (esta
          # migración le agregó p_bank_account_id trailing), así que crea un
          # overload fantasma en vez de reemplazar (ambigüedad 42725 real,
          # detectada en CI: "function ... is not unique" al llamar con menos
          # argumentos posicionales que el total de ambas firmas). Reconverge
          # reaplicando esta migración al final de la cadena: sus propios
          # DROP FUNCTION IF EXISTS (firma exacta sin p_bank_account_id)
          # matchean los overloads fantasma recién creados y los CREATE OR
          # REPLACE que siguen dejan 1 sola definición de cada función (de
          # paso, prueba que esta migración es re-appliable).
          psql -v ON_ERROR_STOP=1 "$DSN" -f supabase/migrations/20261002000001_pos_banco_movimientos.sql
          # limpiezas-pagos-admin: el reapply de 20261002000001 arriba
          # redefine _c29_confirm_order_core y rpc_create_purchase_operation
          # (entre otras) con SU cuerpo vigente en esa fecha — que todavía
          # escribe sales_orders.payment_method (columna que esta migración
          # dropea) y todavía usa los ERRCODE de 4 caracteres que G3
          # corrige. A diferencia de las notas anteriores, acá NO hay
          # conflicto de firma/overload (esta migración no cambia ninguna
          # firma, solo cuerpos vía CREATE OR REPLACE + dos DROP FUNCTION
          # permanentes + un ALTER TABLE DROP COLUMN, todos idempotentes por
          # diseño) — se reconverge reaplicando esta migración una última
          # vez al final de toda la cadena: el DO de G3 vuelve a corregir
          # cualquier ERRCODE revertido, G1a/G1b vuelven a dejar los cuerpos
          # sin la columna, y el DROP COLUMN/DROP FUNCTION, ya aplicados, son
          # no-op (de paso, prueba que esta migración es re-appliable).
          psql -v ON_ERROR_STOP=1 "$DSN" -f supabase/migrations/20261003000001_limpiezas_pagos_admin.sql
          # asiento-venta-formulario: el reapply de 20261003000001 arriba
          # redefine _journal_post_from_event, rpc_create_sale_operation_v2,
          # rpc_atomic_update_sale_operation y rpc_process_outbox_dispatch
          # con SU cuerpo vigente en esa fecha — ANTES de este change, sin
          # las ramas SaleOperationCreated/SaleOperationAdjusted ni el
          # reemplazo in-place de la edición. `supabase start` ya aplicó
          # esta migración nueva una vez al levantar el stack (es la última
          # de la cadena por timestamp); reaplicar una migración MÁS VIEJA
          # después la revierte en silencio, y el gate nuevo de abajo
          # fallaría con un "phantom regression" que no reproduce en local
          # (mismo mecanismo que las notas anteriores, sin conflicto de
          # firma/overload acá — CREATE OR REPLACE sin DROP en las cuatro
          # funciones, REVOKE/GRANT idempotentes). Se reconverge reaplicando
          # esta migración una última vez al final de toda la cadena (de
          # paso, prueba que es re-appliable).
          psql -v ON_ERROR_STOP=1 "$DSN" -f supabase/migrations/20261004000001_asiento_venta_formulario.sql
          # delete-guard-ledgers: el reapply de 20261004000001 arriba redefine
          # _journal_post_from_event y rpc_process_outbox_dispatch con SU
          # cuerpo vigente en esa fecha — ANTES de este change, sin las ramas
          # SaleOperationDeleted/PurchaseDeleted ni el filtro ampliado del
          # Consumer 3. Mismo mecanismo que la nota anterior: `supabase start`
          # ya aplicó esta migración nueva una vez al levantar el stack (es la
          # última de la cadena por timestamp); reaplicar una migración MÁS
          # VIEJA después la revierte en silencio — el evento
          # SaleOperationDeleted queda marcado processed_at sin haber pasado
          # por ningún consumer (el filtro de tipo del dispatcher no lo
          # reconoce), así que el gate de abajo fallaría con "asiento
          # esperado reversed, es posted" que no reproduce en local (mismo
          # patrón "phantom regression" documentado arriba). Se reconverge
          # reaplicando esta migración una última vez al final de toda la
          # cadena — sin conflicto de firma/overload (las dos RPCs de borrado
          # son firmas NUEVAS, nunca tocadas por las migraciones más viejas
          # reaplicadas arriba; los dos consumers cambian solo de cuerpo vía
          # CREATE OR REPLACE) — de paso, prueba que es re-appliable.
          psql -v ON_ERROR_STOP=1 "$DSN" -f supabase/migrations/20261005000001_delete_guard_ledgers.sql
          # banco-caja-historial-ajustes: `supabase start` ya aplicó esta
          # migración una vez al levantar el stack (es la más nueva por
          # timestamp). Ninguna migración reaplicada arriba en esta cadena
          # (hasta 20261005000001 inclusive) toca la firma de
          # rpc_register_cash_movement, c28_register_cash_movement,
          # rpc_close_cash_session o rpc_register_bank_movement — sin
          # conflicto de firma/overload al reaplicar esta migración al final.
          # rpc_register_cash_movement/c28_register_cash_movement ganaron
          # p_description trailing (DROP+CREATE con la firma NUEVA de 5 args,
          # ya vigente tras el primer apply) — el DROP FUNCTION IF EXISTS de
          # este archivo matchea esa firma de 5 args y el CREATE que sigue
          # deja 1 sola definición (de paso, prueba que es re-appliable —
          # verificado también localmente con `docker exec ... psql -f`,
          # doble aplicación sin error y sin cambio de fingerprint).
          psql -v ON_ERROR_STOP=1 "$DSN" -f supabase/migrations/20261006000001_banco_caja_historial_ajustes.sql

      # -v ON_ERROR_STOP=1 is required: without it psql prints RAISE EXCEPTION
      # errors but still exits 0, so failing assertions show green in CI.
      - name: Run deterministic KPI tests
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_kpis.sql

      - name: Run edge case KPI tests
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_kpis_edge_cases.sql

      # Anti-regresión advisors 0028/0029: DROP+CREATE resetea ACLs (EXECUTE a
      # PUBLIC). Falla si un trigger SECURITY DEFINER queda expuesto o si una
      # función SECURITY DEFINER queda anon-executable fuera de la allowlist.
      - name: Run function ACL anti-regression gate
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_function_acl_gate.sql

      # limpiezas-pagos-admin (G3, D5): gate PERMANENTE — falla el pipeline si
      # cualquier función viva de public/community usa un ERRCODE custom de
      # menos de 5 caracteres. Postgres los rechaza en runtime (42704
      # unrecognized_exception, mensaje original perdido, degrada a 500
      # genérico en backend/core/errors.py). La corrección puntual de
      # 20260624000001 se perdió porque nada la sostenía — este gate es la
      # red permanente, mismo patrón que test_function_acl_gate.sql.
      - name: Run ERRCODE 5-char anti-regression gate
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_errcode_5char_gate.sql

      # Invariantes del ledger de idempotencia (H-1 QA #361): contrato por-fila
      # de operation_id, kinds del CHECK en sincronía con los escritores, y
      # conflict targets de los RPCs contra el UNIQUE real de 3 columnas.
      # rpc_issue_credit_note vivió rota ~1 mes (kind fuera del CHECK + ON
      # CONFLICT contra un constraint eliminado) sin que nada lo detectara:
      # este test solo corría a mano.
      - name: Run idempotency ledger invariants
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_idempotency.sql

      # deudas-menores-agosto (G1): sale_items_rpc_v2 pasa de opt-in a
      # opt-out — ausencia de fila en account_feature_flags deja de
      # significar legacy y pasa a significar v2. Verifica, para
      # rpc_create_sale_operation Y rpc_create_purchase_operation (mismo
      # flag_key): cuenta sin fila escribe línea, kill-switch explícito
      # (enabled=false) sigue en legacy, línea de servicio no genera fila,
      # idempotencia intacta, y el stock se mueve igual que antes. Hallazgo
      # documentado en la migración: rpc_create_purchase_operation vigente en
      # prod no tenía dispatch a ningún flag — se agregó junto con el
      # INSERT condicionado de purchase_items (ver cabecera de
      # 20260924000001_activate_sale_items_rpc_v2.sql).
      - name: Run sale_items_rpc_v2 activation gates
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_sale_items_rpc_v2_activation.sql

      # edicion-operaciones-lineas (OQ-1 de deudas-menores-agosto): las RPCs de
      # EDICIÓN (rpc_atomic_update_sale_operation / rpc_atomic_update_
      # purchase_operation) implementan REVERSE→DELETE→APPLY; sale_items.
      # sale_id / purchase_items.purchase_id son FK ON DELETE CASCADE, así que
      # cada edición borraba la línea sin recrearla. Verifica: acarreo del
      # snapshot por product_id cuando el producto no cambia (incluso con
      # products.cost movido entre la creación y la edición — control
      # positivo), snapshot fresco cuando cambia o cuando la operación nunca
      # tuvo línea, colisión determinística (dos filas viejas con el mismo
      # product_id), caso mixto (un ítem acarrea y otro re-snapshotea en la
      # misma edición), compras con el header purchases también poblado
      # (incondicional, D5), kill-switch (mismo flag que la creación),
      # higiene referencial, doble submit y los guards P0400/P0403/P0409/
      # P0422 intactos en la edición.
      - name: Run operation edit lines gates
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_operation_edit_lines.sql

      # stock-movements-edicion (OQ-B de edicion-operaciones-lineas): las RPCs
      # de EDICIÓN (rpc_atomic_update_sale_operation / rpc_atomic_update_
      # purchase_operation) mueven branch_stock pero nunca escribían una fila
      # en stock_movements — SalesRepository.delete_by_id / PurchaseRepository.
      # delete_by_id derivan la reversa LEYENDO stock_movements, así que una
      # operación editada quedaba sin movimiento de referencia y su
      # eliminación no reponía stock, en silencio (204 operaciones vivas en
      # prod). Verifica el par espejo REVERSE (sale_return/purchase_return,
      # reference_type sale_update/purchase_update, id viejo) + APPLY (sale/
      # purchase, reference_type sale/purchase, id nuevo — indistinguible de
      # la creación), unit_cost_snapshot acarreado (no re-valuado), línea de
      # servicio sin movimientos, Σ quantity_delta reconstruye el delta de
      # branch_stock, cero huérfanos nuevos, agregar/quitar línea, colisión
      # legacy, doble edición encadenada, y el gate estrella: eliminar una
      # operación previamente EDITADA repone el stock.
      - name: Run stock movements edicion gates
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_stock_movements_edicion.sql

      # metodos-pago-operaciones: catálogo payment_methods (espejo de
      # cost_centers + sort_order + soft delete), RLS activa, CHECK del
      # vocabulario cerrado de kind, unique case-insensitive sobre filas
      # vivas (reusable contra una fila soft-deleted) y aislamiento por
      # cuenta bajo RLS real (SET LOCAL ROLE authenticated).
      - name: Run payment methods catalog gates
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_payment_methods_catalog.sql

      # metodos-pago-operaciones: seed de 6 formas de pago — backfill
      # idempotente de cuentas existentes, signup nuevo nace sembrado
      # (handle_new_user) y un fallo forzado del sub-bloque de seed no
      # aborta el signup (degrade-don't-fail, patrón v3-provisioning-seed).
      - name: Run payment methods seed gates
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_payment_methods_seed.sql

      # metodos-pago-operaciones: las 4 RPCs de operaciones ganan
      # payment_method_id opcional (D4, DROP+CREATE con cuerpo preservado
      # byte a byte). Verifica alta/edición con y sin forma de pago,
      # preservación por COALESCE al editar (D5), rechazo de forma de pago
      # de otra cuenta, y que NO rompió el acarreo de líneas (#415) ni el
      # espejo de stock_movements (#417) sobre la versión NUEVA de las RPCs.
      - name: Run payment method operations gates
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_payment_method_operations.sql

      # metodos-pago-operaciones: rpc_payment_method_report — espejo de
      # rpc_cost_center_report. Agregación por forma de pago, fila "Sin
      # especificar", invariantes RN-D (COALESCE(total,amount), COUNT
      # DISTINCT, borde superior < p_end+1) y rechazo P0401 a no-miembros.
      - name: Run payment method report gates
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_payment_method_report.sql

      # pos-catalogo-pagos: un solo vocabulario — el CHECK de
      # sales_orders.payment_method pasa de 5 a los mismos 7 kind del
      # catálogo (payment_methods_kind_check). Verifica la igualdad de
      # conjuntos, que 'wallet' ahora pasa y 'bitcoin' sigue rechazado, y el
      # mecanismo de backfill de payment_method_id (puebla + idempotente).
      - name: Run pos-catalogo-pagos vocabulary gates
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_pos_payment_vocabulary.sql

      # pos-catalogo-pagos: gate anti-regresión de la regresión de julio 2026
      # — 20260721000001 reescribió _c29_confirm_order_core desde una base
      # anterior a C-30 y borró en silencio el bloque `credit` (cargo de
      # cuenta corriente). Este gate lee la definición VIVA de la función
      # (pg_get_functiondef) y falla si falta cualquiera de los bloques que
      # confirm() SHALL incluir (caja, cuenta corriente, fiscal, outbox,
      # status-history, snapshots) — corría en rojo antes de esta migración.
      - name: Run confirm-core integrity gate (regresión de julio 2026)
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_confirm_core_integrity.sql

      # pos-catalogo-pagos: guard 42725 — rpc_quick_sale y
      # rpc_confirm_sales_order tienen todos sus parámetros con DEFAULT desde
      # el segundo; agregar payment_method_id trailing sin dropear la firma
      # vieja crea un overload ambiguo. Verifica una sola firma por función
      # (incluido el helper interno _c29_confirm_order_core) y que las ACLs
      # (authenticated con EXECUTE, PUBLIC/anon sin acceso) sobrevivieron al
      # DROP+CREATE.
      - name: Run pos-catalogo-pagos RPC signature gates
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_pos_rpc_signatures.sql

      # pos-catalogo-pagos: gate funcional de punta a punta sobre
      # rpc_quick_sale / _c29_confirm_order_core reales (no mocks) — el gate
      # ESTRELLA es (5): una venta a crédito postea customer_account_movement
      # + evento CustomerAccountCharged + CustomerAccount.balance, sin
      # cash_movements, restaurando la regresión de julio 2026. Cubre también
      # los guards P0404/P0400 de resolución de payment_method_id (otra
      # cuenta, mismatch, inactiva), el camino legacy sin id, la
      # materialización lazy de CustomerAccount, los kind sin cableado
      # (transfer: cero efectos), idempotencia con replay en otra forma de
      # pago, y regresión sobre branch_stock/unit_cost_snapshot/sale_items
      # snapshots/día ART/document_status_history.
      - name: Run pos-catalogo-pagos confirm + payment method gates
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_pos_confirm_payment_method.sql

      # analytics-events-revival: choke point único de telemetría de producto
      # (trigger AFTER INSERT en sales/purchases/expenses). Verifica emisión,
      # unicidad de activación, atomicidad, degrade-don't-fail, ACL/RLS,
      # idempotencia y granularidad — el hallazgo F5 del informe de KPIs
      # (docs/plan-remediacion-kpis-2026-08-11.md) que dejaba activación/UMV/
      # retención midiendo ruido para toda ruta de escritura moderna.
      - name: Run analytics events revival gates
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_analytics_events.sql

      # admin-kpi-refresh (hallazgo F6, docs/plan-remediacion-kpis-2026-08-11.md
      # Fase 4): las definiciones de los KPI de los paneles admin viven en SQL,
      # no en el cliente. Verifica personas-vs-eventos (usuarios de comunidad
      # como COUNT DISTINCT, no suma de activos por período), activaciones/UMV
      # como conteos distintos sobre el rango, cobertura de datos declarada,
      # madurez de cohorte (observation_window_days/is_mature), comunidad
      # medida sobre community.posts/replies (roto por C-23 hasta esta
      # migración) y superficie de autorización (1 definición, ACLs, rechazo
      # de no-admin) en las 5 RPCs admin redefinidas.
      - name: Run admin KPI refresh gates
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_admin_kpis.sql

      # community-counter-triggers-schema-fix: ALTER TABLE ... SET SCHEMA mueve
      # la tabla y conserva los triggers colgados de ella, pero NO reescribe el
      # cuerpo de las funciones que ejecutan. C-23 movió 16 tablas a community.*
      # y dejó las dos funciones de contador escribiendo en public.posts: como
      # son triggers AFTER, el 42P01 abortaba la transacción y responder un post
      # o dar like no persistía nada (roto en prod desde 2026-06-15). Este gate
      # verifica el camino feliz con CONTEOS EXACTOS (el guard degrade-don't-fail
      # convierte un fallo del contador en WARNING, así que sin valores exactos
      # una regresión pasaría en verde), que un fallo del contador no tumbe la
      # fila de negocio, y — la red generalizada — que ninguna función de
      # pg_proc en public/community referencie public.<tabla> para ninguna de
      # las 16 tablas movidas. Cubre la FAMILIA del bug, no solo su síntoma.
      - name: Run community interactions gates
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_community_interactions.sql

      # Postmortem `organizations`: un repositorio del backend consultaba una
      # tabla `organizations` que nunca existió en el schema real durante ~2
      # meses — los tests unitarios mockeaban asyncpg, así que nada ejecutaba
      # la query contra una base real y el bug quedó invisible. Este gate
      # escanea backend/**/*.py (regex sobre el texto fuente, stdlib-only) en
      # busca de referencias FROM/JOIN/UPDATE/INSERT INTO/DELETE FROM/
      # TRUNCATE y de llamadas RPC `rpc_*`, y las valida contra pg_class/
      # pg_proc del schema real que acaba de armar `supabase start`.
      - name: Run backend table/function reference gate
        run: python3 scripts/ci/check_backend_table_refs.py --dsn postgresql://postgres:postgres@127.0.0.1:54322/postgres

      # Mismo postmortem `organizations`, ahora del lado del frontend: el
      # frontend le habla a Supabase vía PostgREST usando strings literales
      # (`supabase.from("tabla_fantasma")` / `supabase.rpc("fn_fantasma")`) —
      # un typo o una tabla renombrada ahí solo se descubre en runtime, ni
      # TypeScript ni los tests unitarios (que mockean supabase-js) lo
      # detectan. Este gate escanea frontend/**/*.{ts,tsx} (regex sobre el
      # texto fuente, stdlib-only) en busca de esas llamadas y las valida
      # contra pg_class/pg_proc del schema real que acaba de armar
      # `supabase start`.
      - name: Run frontend table/function reference gate
        run: python3 scripts/ci/check_frontend_table_refs.py --dsn postgresql://postgres:postgres@127.0.0.1:54322/postgres

      # internal-logs-retention: diagnóstico medido en prod (2026-08-17) —
      # 48/86 MB de la DB eran logs internos de mantenimiento. Verifica la
      # función canónica public.purge_internal_logs() (estructural + ACLs),
      # la retención ESCALONADA de cron.job_run_details (1 día jobs de alta
      # frecuencia / 14 días resto y huérfanas — reemplaza la ventana plana
      # de 7 días de 20260630000001), el techo de 90 días de email_logs, el
      # job de VACUUM (FULL) sobre net._http_response (pg_net.ttl nativo ya
      # retiene las filas — sin purga por antigüedad ahí) y el re-registro
      # idempotente de los jobs. Guard defensivo si el schema net no está
      # precreado en el stack local (D7/OQ-3).
      - name: Run internal logs retention gates
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_internal_logs_retention.sql

      # edicion-preserva-contexto: rpc_atomic_update_sale_operation /
      # rpc_atomic_update_purchase_operation preservan el contexto del header
      # (branch_id, canal, unit_id, supplier_id, cost_center_id) al editar en
      # vez de dejarlo NULL en silencio — branch_id/canal se vuelven además
      # editables con el mismo contrato tri-estado que #419 le dio a
      # payment_method_id. Una venta con comprobante fiscal pending_cae/
      # authorized es inmutable (P0423 antes del REVERSE; rejected y sin
      # comprobante no bloquean). La pata APPLY del ledger aterriza en la
      # sucursal EFECTIVA (no en la default) y la sales_orders promovida sin
      # comprobante real se re-apunta al operation_id nuevo. quantity acepta
      # decimales en la ruta de edición, igual que en la de creación.
      #
      # Incluye (§0 de la migración) la reparación de un gap de historial
      # descubierto en RED: sales.quantity/purchases.quantity ya son
      # numeric(15,4) en prod pero ningún archivo de migración lo registraba
      # — el stack local/CI reconstruido desde cero los dejaba en integer,
      # redondeando en silencio. Gateado por el tipo actual de la columna:
      # no-op en prod, repara acá reconstruyendo v_sales_flat/v_purchases_flat
      # con su definición exacta (incluido security_invoker=true).
      - name: Run edicion-preserva-contexto gates
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_edicion_preserva_contexto.sql

      # pagos-cableados-restantes: helper compartido _pay_register_party_charge
      # (cliente/proveedor, invalid_party_kind, balance_after acumulado),
      # formulario de venta a crédito (postea cargo, guard credit_requires_client
      # antes del descuento de stock, no-crédito no toca la cuenta — en ambas
      # ramas del strangler, incl. la legacy con el flag off), opt-in de caja
      # (las tres condiciones de servidor + expected_balance con/sin opt-in),
      # rpc_create_purchase_operation emite el kind real (ya no hardcodea
      # 'credit'), _journal_post_from_event rutea wallet a 1110 Banco en las
      # tres ramas con predicado bancario (PurchaseCreated queda sin cambios,
      # documentado), y D6 (inmutabilidad de operaciones con cargo o
      # movimiento posteado, cubriendo las DOS convenciones de reference_id —
      # operation_id del formulario y sales_orders.id del POS — en venta y
      # compra, con el control negativo de que una operación sin cargo sigue
      # editable).
      - name: Run pagos-cableados-restantes gates
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_pagos_cableados_restantes.sql

      # pos-banco-movimientos: la venta y la compra por método bancario
      # escriben su bank_movement intra-transacción (0 filas en prod hoy —
      # gate ESTRELLA). Verifica: default por método + override + sin cuenta
      # resuelta = no-op byte a byte (D2), mapa kind→movement_type (D3:
      # transfer/wallet → transfer_in/out, card bruto → card_settlement),
      # venta a crédito + cobro posterior = exactamente UN movimiento (sin
      # doble contabilización), contrato con la conciliación de C3 (match 1:1
      # deja el movimiento matched, sin piezas nuevas), P0423 extendido a
      # bank_movements en la edición de venta y de compra (con el control
      # negativo de que una operación sin ningún cargo/movimiento sigue
      # editable) y P0424 sobre un período ya conciliado y cerrado.
      - name: Run pos-banco-movimientos gates
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_pos_banco_movimientos.sql

      # asiento-venta-formulario: rpc_create_sale_operation_v2 (ruta viva del
      # formulario de venta) no emitía ningún evento al outbox — 228 ventas
      # del formulario sin asiento contable, 66% de las operaciones de venta
      # de la app. Verifica: (1) el gap raíz cerrado — una venta del
      # formulario produce 1 asiento balanceado vía el relay real; (2) ruteo
      # por kind (credit/transfer/cash/sin-imputar -> 1300/1110/1100/1100,
      # crédito único 4100 sin IVA — sin-imputar rutea a Caja, no a
      # Deudores, D3); (3) posted_at = fecha de la venta, no el instante del
      # relay; (4) override del PO (2026-08-20, reemplaza la inmutabilidad
      # que el design original recomendaba): editar una operación con
      # rastro contable AJUSTA el asiento en vez de bloquear la edición —
      # reemplazo in-place del evento pendiente si el relay no procesó
      # todavía (4a), contra-entry + asiento nuevo si ya procesó (4b), y dos
      # gates de cadena de ediciones — GATE ESTRELLA (4c: la segunda
      # contra-entry revierte el asiento de la primera edición, no el
      # original; 4d: dos ediciones antes de procesar colapsan en un solo
      # evento de ajuste, sin eventos fantasma); (5) control negativo — el
      # POS sigue emitiendo SOLO SaleConfirmed, nunca SaleOperationCreated,
      # sin doble posteo.
      - name: Run asiento-venta-formulario gates
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_asiento_venta_formulario.sql

      # delete-guard-ledgers: borrar una operación con dinero posteado no
      # compensaba ningún libro (cargo fantasma real de $75.150 el
      # 2026-08-21). Verifica: (GATE ESTRELLA) una operación con dinero en
      # LOS CUATRO LIBROS a la vez (cuenta corriente, caja, banco, contable)
      # vuelve a cero neto tras borrarla, con contra-asiento balanceado y
      # kardex repuesto; (P0423) venta con comprobante fiscal emitido no se
      # puede borrar; (P0425) venta a crédito ya cobrada no se puede
      # borrar — el saldo no se toca; (P0426) sin sesión de caja abierta no
      # se puede borrar, y con una sesión cerrada + otra abierta la
      # compensación cae en la abierta sin tocar el arqueo firmado de la
      # cerrada; (D8) borrar una venta del POS cancela su sales_order
      # (status + desvínculo + transición en el historial); idempotencia
      # del reproceso del outbox; espejo de rpc_delete_purchase_operation
      # (debit_note de proveedor, cost_center_id preservado en la
      # reversión); operación sin dinero se borra como antes; id
      # inexistente devuelve false sin excepción.
      - name: Run delete-guard-ledgers gates
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_delete_guard_ledgers.sql

      # banco-caja-historial-ajustes: pedido textual del PO 2026-08-22 — Caja y
      # Banco pasan a módulos propios con historial completo (molde Stock) y
      # ajuste manual con motivo obligatorio en ambos libros, sin tapar la
      # señal antifraude del arqueo (RN-95) y sin postear asiento (OQ-2).
      # Verifica: ANTI-OVERLOAD 42725 (rpc_register_cash_movement y
      # c28_register_cash_movement, ambas con p_description trailing) + ACLs
      # de las 4 funciones tocadas; ajuste de caja sobrante/faltante con
      # motivo (balance_after correcto) y rechazo por CHECK sin motivo (vía
      # RPC y vía INSERT directo); cierre de sesión con adjustments_total y
      # difference_before_adjustments — GATE ANTIFRAUDE: un ajuste que lleva
      # difference a 0 deja difference_before_adjustments como evidencia, con
      # signos mixtos sumando correctamente; ajuste bancario P0413 sin motivo
      # SIN quemar el slot de idempotencia (reintento con la misma clave +
      # motivo tiene éxito real) y transfer_in sin motivo intacto.
      - name: Run banco-caja-historial-ajustes gates
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_banco_caja_historial_ajustes.sql

      # cuentas-billetera-tipo: pedido textual del PO 2026-08-22 — distingue
      # banco real de billetera virtual en bank_accounts (account_kind). Las
      # 4 cuentas activas de prod son billeteras, ninguna es un banco real.
      # Verifica: account_kind NOT NULL default 'bank' + CHECK de dominio
      # cerrado; backfill por heurística de nombre (12 marcas de la lista
      # cerrada → wallet, control negativo "Banco Comodoro" y una cuenta
      # ambigua → bank); IDEMPOTENCIA REAL del archivo completo de migración
      # reaplicado dos veces vía \i (una corrección manual sobrevive el
      # segundo reapply); rpc_create_bank_account acepta p_account_kind (8º
      # parámetro, DEFAULT 'bank', ERRCODE P0414 fuera de dominio);
      # ANTI-OVERLOAD 42725 (una sola firma); ACLs restituidas tras el
      # DROP+CREATE OR REPLACE.
      - name: Run cuentas-billetera-tipo gates
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_cuentas_billetera_tipo.sql
