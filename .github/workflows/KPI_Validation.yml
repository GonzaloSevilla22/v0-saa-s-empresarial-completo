      # tenancy-guard-caja-outbox h2/h2 bis (hotfix 2026-08-24): un solo
      # despachador del outbox. Este gate es el NUEVO DOMICILIO de los
      # invariantes de comportamiento que cubrían los 5 archivos de tests del
      # relay Python retirado (backend/tests/outbox/test_audit_consumer.py,
      # test_email_consumer.py, test_idempotency.py, test_relay_select.py,
      # test_e2e_outbox.py) — se retiraron con `OutboxRelayService`, que corría
      # 2 de los 4 consumers y marcaba processed_at igual, suprimiendo el
      # asiento contable y la notificación de todo evento que le ganaba al
      # pg_cron. Los mocks se cambian por el despachador REAL en Postgres real:
      # efecto verificado de los Consumers 1 y 2, scoping del email, evento con
      # consumer fallido que queda pendiente SIN efectos parciales y sin
      # abortar el lote, reproceso sin duplicados, retry preservado, y el
      # outbox fuera del alcance del rol de aplicación — las tres RPCs Y la
      # TABLA public.events (privilegios + ausencia de policy de escritura
      # alcanzable por authenticated). Cuenta sintética con UUID reservado y
      # cleanup verificado (corre dos veces seguidas en verde sin residuos).
      #
      # AISLAMIENTO: el archivo entero corre dentro de un BEGIN … ROLLBACK
      # propio, y eso es parte del contrato, no una precaución. El despachador
      # elige su lote por `processed_at IS NULL` SIN filtro de cuenta —es un
      # relay—, así que una corrida sin rollback cierra TODO el outbox
      # pendiente de la base, no sólo el de la cuenta sintética. En CI eso da
      # igual (la base nace de un `db reset`), pero en el stack local
      # compartido le drenaba el outbox a otra sesión, y el chequeo de "cero
      # residuos" no lo veía porque sólo mira la cuenta sintética. Verificado
      # el 2026-08-24: con el ROLLBACK, el conjunto de eventos pendientes
      # ajenos queda idéntico (mismo count y mismo md5 de ids) antes y después
      # de correr el gate. Puede hacer COMMIT de nada porque la RPC es una
      # FUNCTION plpgsql y no puede commitear por su cuenta.
      # Se mantiene igual como ÚLTIMO step: es el gate más caro y el único que
      # ejerce el despachador completo en runtime.
      # El chequeo (5) del inventario de ACLs vive dentro de
      # test_function_acl_gate.sql, que ya corre más arriba: no necesita step
      # propio.
      - name: Run outbox single-dispatcher gates
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_outbox_single_dispatcher.sql

      # tenancy-guard-caja-outbox h1 (2026-08-24): guard de tenencia de la
