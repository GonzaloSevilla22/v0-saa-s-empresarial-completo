      - name: Run tenancy-guard-caja-outbox gates
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/test_tenancy_guard_caja_outbox.sql

