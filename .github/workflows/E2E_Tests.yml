# Gate E2E (Playwright) sobre la fundación del PR #361: login/logout, rutas
# protegidas, dashboard con KPIs y camino híbrido completo (backend.spec.ts),
# contra el stack LOCAL entero — Supabase local (cadena de migraciones
# completa) + backend FastAPI (uvicorn, JWT-passthrough contra el JWT_SECRET
# local, Redis deshabilitado por REDIS_URL vacía) + Next dev server (lo
# levanta el webServer de playwright.config.ts).
# El env-guard de las fixtures aborta si algo apunta fuera de localhost.
name: E2E Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'supabase/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/E2E_Tests.yml'

concurrency:
  group: e2e-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Credenciales de usuarios QA — SOLO existen en el Supabase efímero del
      # runner (seed-users.mjs los crea tras `supabase start`). No son secretos.
      QA_TEST_USER_EMAIL: qa.e2e@local.test
      QA_TEST_USER_PASSWORD: qa-e2e-ci-password-1
      QA_LOGOUT_USER_EMAIL: qa.logout@local.test
      QA_LOGOUT_USER_PASSWORD: qa-logout-ci-password-1
      # El backend no corre en CI; el env-guard solo exige que la URL sea local.
      NEXT_PUBLIC_BACKEND_URL_LOCAL: http://localhost:8000
      PLAYWRIGHT_BASE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase (aplica la cadena de migraciones completa)
        run: supabase start

      - name: Export local Supabase env
        run: |
          eval "$(supabase status -o env)"
          if [ -z "$API_URL" ] || [ -z "$ANON_KEY" ] || [ -z "$SERVICE_ROLE_KEY" ]; then
            echo "::error::supabase status no expuso API_URL/ANON_KEY/SERVICE_ROLE_KEY — revisar formato de 'supabase status -o env'"
            supabase status -o env
            exit 1
          fi
          if [ -z "$DB_URL" ] || [ -z "$JWT_SECRET" ]; then
            echo "::error::supabase status no expuso DB_URL/JWT_SECRET (los necesita el backend FastAPI)"
            exit 1
          fi
          {
            echo "NEXT_PUBLIC_SUPABASE_URL_LOCAL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY_LOCAL=$ANON_KEY"
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "DATABASE_URL=$DB_URL"
            echo "SUPABASE_JWT_SECRET=$JWT_SECRET"
          } >> "$GITHUB_ENV"

      - name: Seed QA users
        run: node frontend/e2e/fixtures/seed-users.mjs

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      # El pool asyncpg conecta al DATABASE_URL local en el arranque (min_size=2).
      # REDIS_URL vacía = Redis deshabilitado con warning (rate limiting off) —
      # comportamiento documentado de backend/core/redis_client.py.
      - name: Start FastAPI backend
        env:
          BACKEND_ALLOWED_ORIGIN: http://localhost:3000
          REDIS_URL: ''
          WSFE_ADAPTER_MODE: stub
        run: |
          nohup python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 > backend-uvicorn.log 2>&1 &

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then
              echo "backend arriba ($((i*2))s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::el backend no respondió /health en 60s"
          tail -80 backend-uvicorn.log
          exit 1

      - name: Install Playwright browsers
        run: pnpm -C frontend exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm -C frontend exec playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
            backend-uvicorn.log
          retention-days: 7
