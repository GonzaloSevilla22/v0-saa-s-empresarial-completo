      # Verifica: ANTI-OVERLOAD 42725 (rpc_register_cash_movement y
      # c28_register_cash_movement, ambas con p_description trailing) + ACLs
      # de las 4 funciones tocadas; ajuste de caja sobrante/faltante con
      # motivo (balance_after correcto) y rechazo por CHECK sin motivo (vía
